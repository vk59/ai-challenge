name: Day 32 AI code review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: day32-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Explain fork limitation
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Day 32 AI review cannot access model secrets or write review comments for fork pull requests."
          echo "Run the documented maintainer-assisted local flow after reviewing the fork changes."
          exit 1

      - name: Check model secret
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Add OPENROUTER_API_KEY in repository Actions secrets."
            exit 1
          fi

      - name: Check out PR base revision
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Set up Python
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch PR head without executing it
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"

      - name: Generate and publish review
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python3 days/day-32-code-review/review.py \
            --repo "$GITHUB_WORKSPACE" \
            --base "$BASE_SHA" \
            --head "refs/remotes/pull/${PR_NUMBER}/head" \
            --output "$RUNNER_TEMP/day32-review.md" \
            --post \
            --repository "$GITHUB_REPOSITORY" \
            --pull-number "$PR_NUMBER"
