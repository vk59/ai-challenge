<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>День 11 — модель памяти агента</title>
<style>
  :root {
    --chrome:    rgba(246,246,246,.72);
    --canvas:    #ffffff;
    --text:      #1d1d1f;
    --muted:     #86868b;
    --bubble:    #e9e9eb;
    --field:     #ffffff;
    --border:    rgba(0,0,0,.12);
    --hairline:  rgba(0,0,0,.08);
    --accent:    #007aff;
    --code-bg:   rgba(0,0,0,.05);
    --danger:    #d70015;
    --danger-bg: rgba(215,0,21,.10);
    --short:     #ff9f0a;
    --working:   #30b0c7;
    --long:      #bf5af2;
    --desktop:   linear-gradient(150deg,#8ea8d8 0%,#a99ad4 45%,#d3a2bd 100%);
    --shadow:    0 22px 70px rgba(0,0,0,.30), 0 2px 8px rgba(0,0,0,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --chrome:    rgba(58,58,60,.72);
      --canvas:    #1e1e1e;
      --text:      #f5f5f7;
      --muted:     #98989d;
      --bubble:    #3a3a3c;
      --field:     #2c2c2e;
      --border:    rgba(255,255,255,.14);
      --hairline:  rgba(255,255,255,.10);
      --accent:    #0a84ff;
      --code-bg:   rgba(255,255,255,.07);
      --danger:    #ff6961;
      --danger-bg: rgba(255,105,97,.12);
      --short:     #ffb340;
      --working:   #40c8e0;
      --long:      #da8fff;
      --desktop:   linear-gradient(150deg,#1b2434 0%,#2a2340 50%,#3a2436 100%);
      --shadow:    0 22px 70px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35);
    }
  }
  *,*::before,*::after { box-sizing: border-box; }
  html,body { height:100%; }
  body {
    margin:0; display:grid; place-items:center; padding:24px 18px;
    background:var(--desktop); background-attachment:fixed; color:var(--text);
    font:14px/1.5 -apple-system,"SF Pro Text",BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .window {
    width:min(100%,1060px); height:min(100%,740px);
    display:flex; flex-direction:column;
    background:var(--canvas); border-radius:12px;
    box-shadow:var(--shadow),0 0 0 .5px var(--border); overflow:hidden;
  }
  .titlebar {
    position:relative; flex:none; height:50px; display:flex; align-items:center;
    gap:7px; padding:0 14px; background:var(--chrome);
    -webkit-backdrop-filter:saturate(180%) blur(24px);
    backdrop-filter:saturate(180%) blur(24px);
    border-bottom:.5px solid var(--hairline);
  }
  .lights { display:flex; gap:8px; margin-right:auto; }
  .light { width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12); }
  .light.red{background:#ff5f57}.light.yellow{background:#febc2e}.light.green{background:#28c840}
  .titles { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
            text-align:center; pointer-events:none; }
  .titles b { display:block; font-size:13px; font-weight:600; }
  .titles span { display:block; font-size:11px; color:var(--muted); }
  .btn {
    height:24px; padding:0 11px; font:inherit; font-size:12px; color:var(--text);
    background:var(--field); border:.5px solid var(--border);
    border-radius:6px; cursor:pointer; white-space:nowrap;
  }
  .btn:active:not(:disabled){background:var(--bubble)}
  .btn:disabled{opacity:.4;cursor:default}

  .body { flex:1; min-height:0; display:flex; }
  .chat { flex:1; min-width:0; display:flex; flex-direction:column; }
  .transcript { flex:1; min-height:0; overflow-y:auto; padding:18px;
                display:flex; flex-direction:column; gap:12px; }
  .msg{display:flex;flex-direction:column}
  .msg.me{align-items:flex-end}.msg.bot{align-items:flex-start}
  .bubble{max-width:82%;padding:8px 13px;border-radius:17px;overflow-wrap:anywhere}
  .me .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:5px;white-space:pre-wrap}
  .bot .bubble{background:var(--bubble);border-bottom-left-radius:5px}
  .bot .bubble.error{background:var(--danger-bg);color:var(--danger)}
  .meta{margin:4px 6px 0;font-size:11px;color:var(--muted)}
  .bubble p{margin:.5em 0}.bubble>:first-child{margin-top:0}.bubble>:last-child{margin-bottom:0}
  .bubble code{font:12px/1.4 ui-monospace,"SF Mono",Menlo,monospace;
               background:var(--code-bg);padding:.1em .3em;border-radius:4px}
  .bubble pre{margin:.5em 0;padding:9px 11px;background:var(--code-bg);
              border-radius:8px;overflow-x:auto}
  .bubble pre code{background:none;padding:0}
  .streaming::after{content:'';display:inline-block;vertical-align:-2px;width:7px;
    height:14px;margin-left:2px;background:currentColor;border-radius:1px;
    animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .dots{display:flex;gap:4px;padding:4px 1px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);
          animation:bounce 1.25s ease-in-out infinite}
  .dots i:nth-child(2){animation-delay:.16s}.dots i:nth-child(3){animation-delay:.32s}
  @keyframes bounce{0%,60%,100%{opacity:.3}30%{opacity:1;transform:translateY(-3px)}}
  .empty{margin:auto;text-align:center;max-width:420px;color:var(--muted)}
  .empty .glyph{font-size:28px;opacity:.5}
  .empty h2{margin:8px 0 4px;font-size:16px;font-weight:600;color:var(--text)}
  .empty p{margin:0;font-size:12.5px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
  .chip{font:inherit;font-size:12px;color:var(--text);background:var(--field);
        border:.5px solid var(--border);border-radius:13px;padding:4px 11px;cursor:pointer}
  .chip:hover{background:var(--bubble)}

  .composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:10px 12px;
            background:var(--chrome);border-top:.5px solid var(--hairline)}
  .composer textarea{flex:1;resize:none;max-height:120px;padding:7px 12px;font:inherit;
    color:var(--text);background:var(--field);border:.5px solid var(--border);
    border-radius:16px;outline:none}
  .composer textarea:focus{border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
  .send{flex:none;width:30px;height:30px;display:grid;place-items:center;font-size:15px;
    color:#fff;background:var(--accent);border:0;border-radius:50%;cursor:pointer}
  .send:disabled{background:var(--bubble);color:var(--muted);cursor:default}

  /* ── панели памяти: главное в этом дне ─────────────────────────── */
  .memory{flex:none;width:352px;border-left:.5px solid var(--hairline);
    background:var(--chrome);display:flex;flex-direction:column;overflow-y:auto}
  .layer{border-bottom:.5px solid var(--hairline);padding:11px 13px}
  .layer h3{margin:0 0 2px;font-size:12px;font-weight:650;display:flex;
            align-items:center;gap:6px}
  .layer h3 .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .layer.short h3 .dot{background:var(--short)}
  .layer.working h3 .dot{background:var(--working)}
  .layer.long h3 .dot{background:var(--long)}
  .layer .scope{font-size:10.5px;color:var(--muted);margin:0 0 8px 14px}
  .layer .scope b{color:var(--text);font-weight:600}
  .items{display:flex;flex-direction:column;gap:4px}
  .item{font-size:11.5px;background:var(--field);border:.5px solid var(--border);
        border-radius:6px;padding:5px 8px;display:flex;gap:6px;align-items:baseline}
  .item.fresh{animation:pop .8s ease-out}
  @keyframes pop{0%{background:color-mix(in srgb,var(--accent) 30%,var(--field))}
                 100%{background:var(--field)}}
  .item .k{font-weight:600;flex:none;max-width:44%;overflow:hidden;text-overflow:ellipsis;
           white-space:nowrap}
  .item .v{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
           white-space:nowrap}
  .item .x{margin-left:auto;cursor:pointer;color:var(--muted);flex:none;opacity:.5}
  .item .x:hover{opacity:1;color:var(--danger)}
  .kind{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;
        color:var(--muted);margin:7px 0 3px 2px;font-weight:600}
  .nothing{font-size:11px;color:var(--muted);font-style:italic;padding:2px}
  .turn{font-size:11px;background:var(--field);border:.5px solid var(--border);
        border-radius:6px;padding:4px 8px;white-space:nowrap;overflow:hidden;
        text-overflow:ellipsis}
  .turn b{font-weight:600}
  .addrow{display:flex;gap:4px;margin-top:7px}
  .addrow input{flex:1;min-width:0;font:inherit;font-size:11px;padding:4px 7px;
    background:var(--field);border:.5px solid var(--border);border-radius:5px;
    color:var(--text);outline:none}
  .addrow input:focus{border-color:var(--accent)}
  .addrow select{font:inherit;font-size:11px;padding:3px;background:var(--field);
    border:.5px solid var(--border);border-radius:5px;color:var(--text)}
  .addrow button{font:inherit;font-size:11px;padding:3px 8px;background:var(--field);
    border:.5px solid var(--border);border-radius:5px;color:var(--text);cursor:pointer}

  .statusbar{flex:none;display:flex;gap:13px;flex-wrap:wrap;padding:6px 14px;
    font-size:11px;color:var(--muted);background:var(--chrome);
    border-top:.5px solid var(--hairline)}
  .statusbar b{color:var(--text);font-weight:600}

  .native body{display:block;padding:0;background:var(--canvas)}
  .native .window{width:100%;height:100%;border-radius:0;box-shadow:none}
  .native .titlebar{display:none}
  .native .statusbar .native-actions{display:flex;gap:6px;margin-left:auto}
  .statusbar .native-actions{display:none}

  @media (max-width:900px){ .memory{width:290px} }
</style>
</head>
<body>

<div class="window">
  <header class="titlebar">
    <div class="lights"><span class="light red"></span><span class="light yellow"></span><span class="light green"></span></div>
    <div class="titles"><b>Модель памяти агента</b><span id="subtitle">День 11</span></div>
    <select class="btn" id="sessions" title="Диалоги"></select>
    <button class="btn" id="newChat">Новый диалог</button>
    <button class="btn" id="eraseChat" title="Стереть этот диалог">Стереть</button>
  </header>

  <div class="body">
    <div class="chat">
      <div class="transcript" id="transcript"></div>
      <footer class="composer">
        <textarea id="prompt" rows="1" placeholder="Сообщение…" autofocus></textarea>
        <button class="send" id="send" disabled title="Отправить (Enter)">↑</button>
      </footer>
    </div>

    <aside class="memory">
      <section class="layer short">
        <h3><span class="dot"></span>Краткосрочная</h3>
        <p class="scope">область: <b id="shortScope">—</b> · в окне <b id="shortCount">0</b> пар</p>
        <div class="items" id="shortItems"></div>
      </section>

      <section class="layer working">
        <h3><span class="dot"></span>Рабочая</h3>
        <p class="scope">область: <b id="workScope">—</b> · данные текущей задачи</p>
        <div class="items" id="workItems"></div>
        <div class="addrow">
          <input id="wKey" placeholder="ключ"><input id="wVal" placeholder="значение">
          <button id="wAdd">+</button>
        </div>
      </section>

      <section class="layer long">
        <h3><span class="dot"></span>Долговременная</h3>
        <p class="scope">область: <b id="longScope">все диалоги</b> · переживает смену задачи</p>
        <div id="longItems"></div>
        <div class="addrow">
          <input id="lKey" placeholder="ключ"><input id="lVal" placeholder="значение">
          <select id="lKind">
            <option value="profile">профиль</option>
            <option value="decision">решение</option>
            <option value="knowledge">знание</option>
          </select>
          <button id="lAdd">+</button>
        </div>
      </section>
    </aside>
  </div>

  <div class="statusbar">
    <span>модель <b id="model">—</b></span>
    <span>запрос <b id="weigh">0</b> токенов</span>
    <span>всего <b id="tokens">0</b></span>
    <span>служебных <b id="overhead">0</b></span>
    <span>потрачено <b id="spent">—</b></span>
    <span class="native-actions">
      <select class="btn" id="sessionsNative" title="Диалоги"></select>
      <button class="btn" id="newChatNative">Новый диалог</button>
      <button class="btn" id="eraseNative">Стереть</button>
    </span>
  </div>
</div>

<template id="emptyTpl">
  <div class="empty">
    <div class="glyph">◱</div>
    <h2>Три слоя памяти</h2>
    <p>Справа видно, что куда попадает. Скажите что-нибудь о себе и о задаче —
       и смотрите, как агент раскладывает это по слоям.</p>
    <div class="chips">
      <button class="chip">Меня зовут Иван, я пишу на Python</button>
      <button class="chip">Бюджет проекта — 800 тысяч, срок 3 месяца</button>
      <button class="chip">Решили: база PostgreSQL 16</button>
      <button class="chip">Как меня зовут и какой бюджет?</button>
    </div>
  </div>
</template>

<script>
const $ = s => document.querySelector(s);
const transcript=$('#transcript'), promptEl=$('#prompt'), sendEl=$('#send');
let busy=false, state={}, свежие={working:[],long:[]};

if (new URLSearchParams(location.search).has('native'))
  document.documentElement.classList.add('native');

function md(src){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if(((src.match(/```/g)||[]).length)%2) src+='\n```';
  const blocks=[];
  src=src.replace(/```[a-zA-Z0-9+#.-]*\n?([\s\S]*?)```/g,(_,b)=>{
    blocks.push('<pre><code>'+esc(b.replace(/\n+$/,''))+'</code></pre>');
    return '\n@@C'+(blocks.length-1)+'@@\n';});
  const inl=s=>esc(s).replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  const out=[];
  for(const raw of src.split('\n')){
    const l=raw.trim(); const p=l.match(/^@@C(\d+)@@$/);
    if(p){out.push(blocks[+p[1]]);continue;}
    if(!l)continue;
    out.push('<p>'+inl(l)+'</p>');
  }
  return out.join('');
}

function showEmpty(){ transcript.replaceChildren($('#emptyTpl').content.cloneNode(true)); }

function addMsg(who){
  const e=$('.empty'); if(e)e.remove();
  const d=document.createElement('div'); d.className='msg '+who;
  d.innerHTML='<div class="bubble"></div>'; transcript.append(d);
  return d.firstElementChild;
}
const scroll=()=>transcript.scrollTo({top:transcript.scrollHeight,behavior:'smooth'});

function item(k,v,onX,fresh){
  const d=document.createElement('div');
  d.className='item'+(fresh?' fresh':'');
  d.innerHTML='<span class="k"></span><span class="v"></span>';
  d.firstElementChild.textContent=k;
  d.children[1].textContent=v;
  if(onX){const x=document.createElement('span');x.className='x';x.textContent='✕';
    x.onclick=onX;d.append(x);}
  return d;
}

const ВИДЫ={profile:'профиль',decision:'решения',knowledge:'знания'};

function renderLayers(){
  const L=state.layers||{};
  const s=L.short||{}, w=L.working||{}, l=L.long||{};

  $('#shortScope').textContent=s['область']||'—';
  $('#shortCount').textContent=(s['в окне']??0)+'/'+(s['потолок']??0);
  const si=$('#shortItems'); si.replaceChildren();
  const реплики=(s.реплики||[]).slice(-6);
  if(!реплики.length) si.append(Object.assign(document.createElement('div'),
    {className:'nothing',textContent:'пока пусто'}));
  for(const r of реплики){
    const d=document.createElement('div'); d.className='turn';
    d.innerHTML='<b></b> ';
    d.firstElementChild.textContent=r.role==='user'?'вы:':'агент:';
    d.append(r.content.slice(0,70));
    si.append(d);
  }

  $('#workScope').textContent=w['область']||'—';
  const wi=$('#workItems'); wi.replaceChildren();
  if(!(w.items||[]).length) wi.append(Object.assign(document.createElement('div'),
    {className:'nothing',textContent:'задача ещё не описана'}));
  for(const it of w.items||[])
    wi.append(item(it.key,it.value,null,свежие.working.includes(it.key)));

  const li=$('#longItems'); li.replaceChildren();
  if(!(l.items||[]).length) li.append(Object.assign(document.createElement('div'),
    {className:'nothing',textContent:'агент вас ещё не знает'}));
  for(const вид of ['profile','decision','knowledge']){
    const группа=(l.items||[]).filter(x=>x.kind===вид);
    if(!группа.length) continue;
    const h=document.createElement('div'); h.className='kind'; h.textContent=ВИДЫ[вид];
    li.append(h);
    const box=document.createElement('div'); box.className='items';
    for(const it of группа)
      box.append(item(it.key,it.value,()=>forget(it.key),свежие.long.includes(it.key)));
    li.append(box);
  }
}

function apply(next){
  if(!next) return;
  state={...state,...next};
  $('#model').textContent=state.model||'—';
  $('#subtitle').textContent=(state.session||'')+' · '+(state.model||'');
  $('#tokens').textContent=(state.tokens||0).toLocaleString('ru');
  $('#overhead').textContent=(state.overhead||0).toLocaleString('ru');
  $('#spent').textContent=state.spent||'—';
  if(state.weigh) $('#weigh').textContent=(state.weigh.total||0).toLocaleString('ru');
  fillSessions();
  renderLayers();
}

function renderHistory(h){
  transcript.replaceChildren();
  if(!h||!h.length){showEmpty();return;}
  for(const t of h){
    const b=addMsg(t.role==='user'?'me':'bot');
    if(t.role==='user') b.textContent=t.content; else b.innerHTML=md(t.content);
  }
  transcript.scrollTop=transcript.scrollHeight;
}

async function send(){
  const message=promptEl.value.trim();
  if(!message||busy) return;
  busy=true; promptEl.value=''; grow(); sync();
  addMsg('me').textContent=message;
  const b=addMsg('bot'); b.innerHTML='<div class="dots"><i></i><i></i><i></i></div>';
  scroll();
  let text='';
  try{
    const res=await fetch('/ask',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});
    const rd=res.body.getReader(), dec=new TextDecoder(); let buf='';
    for(;;){
      const {value,done}=await rd.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let nl;
      while((nl=buf.indexOf('\n'))!==-1){
        const line=buf.slice(0,nl).trim(); buf=buf.slice(nl+1);
        if(!line) continue;
        const m=JSON.parse(line);
        if(m.error) throw new Error(m.error);
        if(m.delta){text+=m.delta;b.classList.add('streaming');b.innerHTML=md(text);scroll();}
        if(m.done){
          свежие=m.новое||{working:[],long:[]};
          apply(m);
          const биты=[];
          if(свежие.working.length) биты.push('рабочая: +'+свежие.working.length);
          if(свежие.long.length) биты.push('долговременная: +'+свежие.long.length);
          if(биты.length){
            const el=document.createElement('div'); el.className='meta';
            el.textContent=биты.join(' · '); b.parentElement.append(el);
          }
          setTimeout(()=>{свежие={working:[],long:[]};},1200);
        }
      }
    }
    b.classList.remove('streaming');
  }catch(err){
    b.classList.remove('streaming'); b.classList.add('error');
    b.textContent=String(err.message||err);
  }finally{busy=false;sync();scroll();promptEl.focus();}
}

async function post(url,body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body||{})});
  const d=await r.json();
  if(d.error){alert(d.error);return null;}
  return d;
}

/* «Новый диалог» СОЗДАЁТ новую сессию, а не стирает текущую. Это и есть
   честная проверка слоёв: старый диалог остаётся на диске, краткосрочная
   и рабочая память пустые, а долговременная переезжает. */
async function newConversation(){
  const занятые=new Set((state.sessions||[]).map(s=>s.name));
  let n=занятые.size+1, имя='диалог-'+n;
  while(занятые.has(имя)) имя='диалог-'+(++n);
  const d=await post('/session',{session:имя});
  if(!d) return;
  apply(d); renderHistory(d.history); sync(); promptEl.focus();
}

/* А «Стереть» — стирает по-настоящему, но только этот диалог.
   Долговременная память и тут остаётся: её чистят крестиками. */
async function eraseConversation(){
  const d=await post('/reset');
  if(!d) return;
  apply(d); renderHistory(d.history); sync(); promptEl.focus();
}

async function openSession(имя){
  const d=await post('/session',{session:имя});
  if(!d) return;
  apply(d); renderHistory(d.history); sync(); promptEl.focus();
}

function fillSessions(){
  const список=(state.sessions||[]).map(s=>s.name);
  if(!список.includes(state.session)) список.unshift(state.session);
  for(const el of [$('#sessions'),$('#sessionsNative')]){
    if(!el) continue;
    el.replaceChildren(...список.map(имя=>{
      const info=(state.sessions||[]).find(s=>s.name===имя);
      const o=document.createElement('option');
      o.value=имя; o.textContent=info?`${имя} (${info.pairs})`:имя;
      o.selected=имя===state.session; return o;
    }));
  }
}
async function forget(key){ const d=await post('/forget',{key}); if(d) apply(d); }
window.newConversation=newConversation;

function sync(){ sendEl.disabled=busy||!promptEl.value.trim(); }
function grow(){ promptEl.style.height='auto';
  promptEl.style.height=promptEl.scrollHeight+'px'; }

promptEl.addEventListener('input',()=>{grow();sync();});
promptEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
sendEl.addEventListener('click',send);
$('#newChat').addEventListener('click',newConversation);
$('#newChatNative').addEventListener('click',newConversation);
$('#eraseChat').addEventListener('click',eraseConversation);
$('#eraseNative').addEventListener('click',eraseConversation);
$('#sessions').addEventListener('change',e=>openSession(e.target.value));
$('#sessionsNative').addEventListener('change',e=>openSession(e.target.value));

$('#wAdd').addEventListener('click',async()=>{
  const k=$('#wKey').value.trim(), v=$('#wVal').value.trim();
  if(!k||!v) return;
  const d=await post('/remember',{key:k,value:v,layer:'working'});
  if(d){$('#wKey').value='';$('#wVal').value='';apply(d);}
});
$('#lAdd').addEventListener('click',async()=>{
  const k=$('#lKey').value.trim(), v=$('#lVal').value.trim();
  if(!k||!v) return;
  const d=await post('/remember',{key:k,value:v,layer:'long',kind:$('#lKind').value});
  if(d){$('#lKey').value='';$('#lVal').value='';apply(d);}
});

transcript.addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  promptEl.value=c.textContent; grow(); send();
});

fetch('/state').then(r=>r.json())
  .then(d=>{apply(d);renderHistory(d.history);})
  .catch(()=>showEmpty());
</script>
</body>
</html>
