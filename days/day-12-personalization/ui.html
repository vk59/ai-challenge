<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Персонализированный ассистент</title>
<style>
  :root{
    --chrome:rgba(246,246,246,.72);--canvas:#fff;--text:#1d1d1f;--muted:#86868b;
    --bubble:#e9e9eb;--field:#fff;--border:rgba(0,0,0,.12);
    --hairline:rgba(0,0,0,.08);--accent:#007aff;--code-bg:rgba(0,0,0,.05);
    --danger:#d70015;--danger-bg:rgba(215,0,21,.10);--sidebar:rgba(240,240,242,.86);
    --short:#ff9f0a;--working:#30b0c7;--long:#bf5af2;--profile:#34c759;
    --desktop:linear-gradient(150deg,#8ea8d8 0%,#a99ad4 45%,#d3a2bd 100%);
    --shadow:0 22px 70px rgba(0,0,0,.30),0 2px 8px rgba(0,0,0,.14);
  }
  @media (prefers-color-scheme:dark){:root{
    --chrome:rgba(58,58,60,.72);--canvas:#1e1e1e;--text:#f5f5f7;--muted:#98989d;
    --bubble:#3a3a3c;--field:#2c2c2e;--border:rgba(255,255,255,.14);
    --hairline:rgba(255,255,255,.10);--accent:#0a84ff;--code-bg:rgba(255,255,255,.07);
    --danger:#ff6961;--danger-bg:rgba(255,105,97,.12);--sidebar:rgba(36,36,38,.86);
    --short:#ffb340;--working:#40c8e0;--long:#da8fff;--profile:#30d158;
    --desktop:linear-gradient(150deg,#1b2434 0%,#2a2340 50%,#3a2436 100%);
    --shadow:0 22px 70px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35);}}
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:grid;place-items:center;padding:22px 16px;
    background:var(--desktop);background-attachment:fixed;color:var(--text);
    font:13.5px/1.5 -apple-system,"SF Pro Text",BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased}
  .window{width:min(100%,1180px);height:min(100%,760px);display:flex;
    flex-direction:column;background:var(--canvas);border-radius:12px;
    box-shadow:var(--shadow),0 0 0 .5px var(--border);overflow:hidden;position:relative}
  .titlebar{position:relative;flex:none;height:48px;display:flex;align-items:center;
    gap:7px;padding:0 13px;background:var(--chrome);
    -webkit-backdrop-filter:saturate(180%) blur(24px);
    backdrop-filter:saturate(180%) blur(24px);border-bottom:.5px solid var(--hairline)}
  .lights{display:flex;gap:8px;margin-right:auto}
  .light{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
  .light.red{background:#ff5f57}.light.yellow{background:#febc2e}.light.green{background:#28c840}
  .titles{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    text-align:center;pointer-events:none}
  .titles b{display:block;font-size:13px;font-weight:600}
  .titles span{display:block;font-size:11px;color:var(--muted)}
  .btn{height:23px;padding:0 10px;font:inherit;font-size:12px;color:var(--text);
    background:var(--field);border:.5px solid var(--border);border-radius:6px;
    cursor:pointer;white-space:nowrap}
  .btn:active:not(:disabled){background:var(--bubble)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.primary{background:var(--profile);border-color:transparent;color:#fff}

  .body{flex:1;min-height:0;display:flex}
  .chats{flex:none;width:200px;background:var(--sidebar);
    border-right:.5px solid var(--hairline);display:flex;flex-direction:column}
  .chats header{flex:none;display:flex;align-items:center;gap:6px;
    padding:9px 10px 7px;font-size:11px;color:var(--muted);font-weight:600;
    text-transform:uppercase;letter-spacing:.04em}
  .chats header button{margin-left:auto;width:22px;height:22px;display:grid;
    place-items:center;font-size:15px;line-height:1;color:var(--text);
    background:var(--field);border:.5px solid var(--border);border-radius:6px;
    cursor:pointer;padding:0}
  .chatlist{flex:1;min-height:0;overflow-y:auto;padding:0 7px 9px;
    display:flex;flex-direction:column;gap:2px}
  .chat{display:flex;align-items:center;gap:5px;padding:6px 8px;border-radius:7px;
    cursor:pointer;border:.5px solid transparent}
  .chat:hover{background:var(--field)}
  .chat.active{background:var(--field);border-color:var(--border)}
  .chat .info{flex:1;min-width:0}
  .chat .t{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chat.active .t{font-weight:600}
  .chat .s{font-size:10px;color:var(--muted)}
  .chat .x{flex:none;opacity:0;color:var(--muted);font-size:12px;padding:0 2px}
  .chat:hover .x{opacity:.55}
  .chat .x:hover{opacity:1;color:var(--danger)}
  .chat input{width:100%;font:inherit;font-size:12px;padding:1px 4px;
    background:var(--canvas);border:.5px solid var(--accent);border-radius:4px;
    color:var(--text);outline:none}

  .chat-area{flex:1;min-width:0;display:flex;flex-direction:column}
  .transcript{flex:1;min-height:0;overflow-y:auto;padding:17px;
    display:flex;flex-direction:column;gap:11px}
  .msg{display:flex;flex-direction:column}
  .msg.me{align-items:flex-end}.msg.bot{align-items:flex-start}
  .bubble{max-width:84%;padding:8px 13px;border-radius:17px;overflow-wrap:anywhere}
  .me .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:5px;
    white-space:pre-wrap}
  .bot .bubble{background:var(--bubble);border-bottom-left-radius:5px}
  .bot .bubble.error{background:var(--danger-bg);color:var(--danger)}
  .meta{margin:4px 6px 0;font-size:11px;color:var(--muted)}
  .bubble p{margin:.5em 0}.bubble>:first-child{margin-top:0}
  .bubble>:last-child{margin-bottom:0}
  .bubble ul,.bubble ol{margin:.5em 0;padding-left:1.3em}
  .bubble code{font:12px/1.4 ui-monospace,"SF Mono",Menlo,monospace;
    background:var(--code-bg);padding:.1em .3em;border-radius:4px}
  .bubble pre{margin:.5em 0;padding:9px 11px;background:var(--code-bg);
    border-radius:8px;overflow-x:auto}
  .bubble pre code{background:none;padding:0}
  .streaming::after{content:'';display:inline-block;vertical-align:-2px;width:7px;
    height:14px;margin-left:2px;background:currentColor;border-radius:1px;
    animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .dots{display:flex;gap:4px;padding:4px 1px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);
    animation:bounce 1.25s ease-in-out infinite}
  .dots i:nth-child(2){animation-delay:.16s}.dots i:nth-child(3){animation-delay:.32s}
  @keyframes bounce{0%,60%,100%{opacity:.3}30%{opacity:1;transform:translateY(-3px)}}
  .empty{margin:auto;text-align:center;max-width:440px;color:var(--muted)}
  .empty .glyph{font-size:27px;opacity:.5}
  .empty h2{margin:8px 0 4px;font-size:16px;font-weight:600;color:var(--text)}
  .empty p{margin:0;font-size:12.5px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:13px}
  .chip{font:inherit;font-size:12px;color:var(--text);background:var(--field);
    border:.5px solid var(--border);border-radius:13px;padding:4px 11px;cursor:pointer}
  .chip:hover{background:var(--bubble)}
  .composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:10px 12px;
    background:var(--chrome);border-top:.5px solid var(--hairline)}
  .composer textarea{flex:1;resize:none;max-height:118px;padding:7px 12px;font:inherit;
    color:var(--text);background:var(--field);border:.5px solid var(--border);
    border-radius:16px;outline:none}
  .composer textarea:focus{border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
  .send{flex:none;width:30px;height:30px;display:grid;place-items:center;font-size:15px;
    color:#fff;background:var(--accent);border:0;border-radius:50%;cursor:pointer}
  .send:disabled{background:var(--bubble);color:var(--muted);cursor:default}

  .side{flex:none;width:306px;border-left:.5px solid var(--hairline);
    background:var(--chrome);display:flex;flex-direction:column;overflow-y:auto}
  .layer{border-bottom:.5px solid var(--hairline);padding:10px 12px}
  .layer h3{margin:0 0 2px;font-size:11.5px;font-weight:650;display:flex;
    align-items:center;gap:6px}
  .layer h3 .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .layer.profile h3 .dot{background:var(--profile)}
  .layer.short h3 .dot{background:var(--short)}
  .layer.working h3 .dot{background:var(--working)}
  .layer.long h3 .dot{background:var(--long)}
  .layer .scope{font-size:10.5px;color:var(--muted);margin:0 0 7px 14px}
  .layer .scope b{color:var(--text);font-weight:600}
  .items{display:flex;flex-direction:column;gap:4px}
  .item{font-size:11.5px;background:var(--field);border:.5px solid var(--border);
    border-radius:6px;padding:5px 8px;display:flex;gap:6px;align-items:baseline}
  .item.fresh{animation:pop .9s ease-out}
  @keyframes pop{0%{background:color-mix(in srgb,var(--accent) 30%,var(--field))}
    100%{background:var(--field)}}
  .item .k{font-weight:600;flex:none;max-width:45%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .item .v{color:var(--muted);flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .item .x{margin-left:auto;cursor:pointer;color:var(--muted);flex:none;opacity:.5}
  .item .x:hover{opacity:1;color:var(--danger)}
  .kind{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted);margin:6px 0 3px 2px;font-weight:600}
  .nothing{font-size:11px;color:var(--muted);font-style:italic;padding:2px}
  .turn{font-size:11px;background:var(--field);border:.5px solid var(--border);
    border-radius:6px;padding:4px 8px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .turn b{font-weight:600}
  .addrow{display:flex;gap:4px;margin-top:6px}
  .addrow input,.addrow select{flex:1;min-width:0;font:inherit;font-size:11px;
    padding:4px 6px;background:var(--field);border:.5px solid var(--border);
    border-radius:5px;color:var(--text);outline:none}
  .addrow button{flex:none;font:inherit;font-size:11px;padding:3px 8px;
    background:var(--field);border:.5px solid var(--border);border-radius:5px;
    color:var(--text);cursor:pointer}
  .profrow{display:flex;gap:5px;align-items:center;margin-bottom:6px}
  .profrow select{flex:1;font:inherit;font-size:11.5px;padding:4px 6px;
    background:var(--field);border:.5px solid var(--border);border-radius:6px;
    color:var(--text)}
  .prefs{display:flex;flex-direction:column;gap:3px}
  .pref{font-size:11px;display:flex;gap:6px}
  .pref b{font-weight:600;flex:none;min-width:74px;color:var(--text)}
  .pref span{color:var(--muted);min-width:0;overflow-wrap:anywhere}
  details.editor{margin-top:7px}
  details.editor summary{font-size:11px;color:var(--muted);cursor:pointer}
  details.editor .addrow{margin-top:5px}

  .statusbar{flex:none;display:flex;gap:12px;flex-wrap:wrap;padding:6px 13px;
    font-size:11px;color:var(--muted);background:var(--chrome);
    border-top:.5px solid var(--hairline)}
  .statusbar b{color:var(--text);font-weight:600}

  /* ── сравнение профилей: главное в этом дне ────────────────────── */
  .overlay{position:absolute;inset:0;background:var(--canvas);display:none;
    flex-direction:column;z-index:20}
  .overlay.on{display:flex}
  .overlay header{flex:none;display:flex;align-items:center;gap:9px;padding:11px 14px;
    border-bottom:.5px solid var(--hairline);background:var(--chrome)}
  .overlay header b{font-size:13px}
  .overlay header .q{flex:1;min-width:0;font-size:12px;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cols{flex:1;min-height:0;overflow-x:auto;display:flex;gap:11px;padding:13px}
  .col{flex:0 0 300px;display:flex;flex-direction:column;min-height:0;
    border:.5px solid var(--border);border-radius:9px;overflow:hidden;
    background:var(--field)}
  .col h4{margin:0;padding:8px 11px;font-size:12px;font-weight:650;
    background:var(--chrome);border-bottom:.5px solid var(--hairline);
    display:flex;align-items:center;gap:6px}
  .col h4 .dot{width:7px;height:7px;border-radius:50%;background:var(--profile);flex:none}
  .col h4.plain .dot{background:var(--muted)}
  .col .prefsbox{padding:6px 11px;font-size:10.5px;color:var(--muted);
    border-bottom:.5px solid var(--hairline);white-space:pre-wrap;max-height:86px;
    overflow-y:auto}
  .col .answer{flex:1;min-height:0;overflow-y:auto;padding:10px 11px;font-size:12.5px}
  .col .answer pre{background:var(--code-bg);padding:8px;border-radius:7px;
    overflow-x:auto;margin:.4em 0}
  .col .answer code{font:11.5px/1.4 ui-monospace,"SF Mono",Menlo,monospace;
    background:var(--code-bg);padding:.1em .3em;border-radius:4px}
  .col .answer pre code{background:none;padding:0}
  .col .answer ul,.col .answer ol{margin:.4em 0;padding-left:1.2em}
  .col footer{flex:none;padding:6px 11px;font-size:10.5px;color:var(--muted);
    border-top:.5px solid var(--hairline);background:var(--chrome)}

  .native body{display:block;padding:0;background:var(--canvas)}
  .native .window{width:100%;height:100%;border-radius:0;box-shadow:none}
  .native .titlebar{display:none}
  .native .statusbar .native-actions{display:flex;gap:6px;margin-left:auto}
  .statusbar .native-actions{display:none}
  @media (max-width:1000px){.side{width:262px}.chats{width:172px}}
</style>
</head>
<body>

<div class="window">
  <header class="titlebar">
    <div class="lights"><span class="light red"></span><span class="light yellow"></span><span class="light green"></span></div>
    <div class="titles"><b id="chatTitle">Ассистент</b><span id="subtitle">—</span></div>
    <button class="btn primary" id="compareBtn">Сравнить профили</button>
  </header>

  <div class="body">
    <nav class="chats">
      <header>Чаты <button id="newChatBtn" title="Новый чат">+</button></header>
      <div class="chatlist" id="chatList"></div>
    </nav>

    <div class="chat-area">
      <div class="transcript" id="transcript"></div>
      <footer class="composer">
        <textarea id="prompt" rows="1" placeholder="Сообщение…" autofocus></textarea>
        <button class="send" id="send" disabled title="Отправить (Enter)">↑</button>
      </footer>
    </div>

    <aside class="side">
      <section class="layer profile">
        <h3><span class="dot"></span>Профиль</h3>
        <p class="scope">как отвечать · уезжает в <b>каждый</b> запрос</p>
        <div class="profrow">
          <select id="profileSel"></select>
          <button class="btn" id="profileDel" title="Удалить профиль">✕</button>
        </div>
        <div class="prefs" id="prefs"></div>
        <details class="editor">
          <summary>создать профиль</summary>
          <div class="addrow"><input id="pName" placeholder="имя профиля"></div>
          <div class="addrow"><input id="pTone" placeholder="тон"></div>
          <div class="addrow"><input id="pFormat" placeholder="формат"></div>
          <div class="addrow"><input id="pLevel" placeholder="уровень"></div>
          <div class="addrow"><input id="pConstr" placeholder="ограничения"></div>
          <div class="addrow"><button id="pSave">Сохранить и включить</button></div>
        </details>
      </section>

      <section class="layer short">
        <h3><span class="dot"></span>Краткосрочная</h3>
        <p class="scope">этот чат · в окне <b id="shortCount">0</b></p>
        <div class="items" id="shortItems"></div>
      </section>

      <section class="layer working">
        <h3><span class="dot"></span>Рабочая</h3>
        <p class="scope">этот чат · данные задачи</p>
        <div class="items" id="workItems"></div>
        <div class="addrow">
          <input id="wKey" placeholder="ключ"><input id="wVal" placeholder="значение">
          <button id="wAdd">+</button>
        </div>
      </section>

      <section class="layer long">
        <h3><span class="dot"></span>Долговременная</h3>
        <p class="scope">все чаты · переживает смену задачи</p>
        <div id="longItems"></div>
        <div class="addrow">
          <input id="lKey" placeholder="ключ"><input id="lVal" placeholder="значение">
          <select id="lKind">
            <option value="profile">профиль</option>
            <option value="decision">решение</option>
            <option value="knowledge">знание</option>
          </select>
          <button id="lAdd">+</button>
        </div>
      </section>
    </aside>
  </div>

  <div class="statusbar">
    <span>модель <b id="model">—</b></span>
    <span>запрос <b id="weigh">0</b></span>
    <span>из них профиль <b id="wprof">0</b></span>
    <span>всего <b id="tokens">0</b></span>
    <span>потрачено <b id="spent">—</b></span>
    <span class="native-actions">
      <button class="btn" id="newChatNative">Новый чат</button>
      <button class="btn primary" id="compareNative">Сравнить профили</button>
    </span>
  </div>

  <div class="overlay" id="overlay">
    <header>
      <b>Один вопрос — разные профили</b>
      <span class="q" id="cmpQuestion"></span>
      <button class="btn" id="cmpClose">Закрыть</button>
    </header>
    <div class="cols" id="cmpCols"></div>
  </div>
</div>

<template id="emptyTpl">
  <div class="empty">
    <div class="glyph">◐</div>
    <h2>Персонализация</h2>
    <p>Справа выберите профиль — он меняет форму ответа, не меняя вопроса.
       Кнопка «Сравнить профили» задаёт один вопрос всем профилям сразу.</p>
    <div class="chips">
      <button class="chip">Как хранить пароли пользователей?</button>
      <button class="chip">Что такое индекс в базе данных?</button>
      <button class="chip">Меня зовут Иван, пишу на Python</button>
    </div>
  </div>
</template>

<script>
const $=s=>document.querySelector(s);
const transcript=$('#transcript'),promptEl=$('#prompt'),sendEl=$('#send');
let busy=false,state={},свежие={working:[],long:[]};

if(new URLSearchParams(location.search).has('native'))
  document.documentElement.classList.add('native');

function md(src){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if(((src.match(/```/g)||[]).length)%2) src+='\n```';
  const blocks=[];
  src=src.replace(/```[a-zA-Z0-9+#.-]*\n?([\s\S]*?)```/g,(_,b)=>{
    blocks.push('<pre><code>'+esc(b.replace(/\n+$/,''))+'</code></pre>');
    return '\n@@C'+(blocks.length-1)+'@@\n';});
  const inl=s=>esc(s).replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  const out=[];let list=null;
  const close=()=>{if(list){out.push('</'+list+'>');list=null;}};
  for(const raw of src.split('\n')){
    const l=raw.trim();const p=l.match(/^@@C(\d+)@@$/);
    if(p){close();out.push(blocks[+p[1]]);continue;}
    if(!l){close();continue;}
    const b=l.match(/^[-*•]\s+(.*)$/),n=l.match(/^\d+[.)]\s+(.*)$/);
    if(b||n){const w=b?'ul':'ol';if(list!==w){close();out.push('<'+w+'>');list=w;}
      out.push('<li>'+inl((b||n)[1])+'</li>');continue;}
    close();out.push('<p>'+inl(l)+'</p>');
  }
  close();return out.join('');
}

function showEmpty(){transcript.replaceChildren($('#emptyTpl').content.cloneNode(true));}
function addMsg(who){
  const e=$('.empty');if(e)e.remove();
  const d=document.createElement('div');d.className='msg '+who;
  d.innerHTML='<div class="bubble"></div>';transcript.append(d);
  return d.firstElementChild;
}
const scroll=()=>transcript.scrollTo({top:transcript.scrollHeight,behavior:'smooth'});

async function post(url,body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body||{})});
  const d=await r.json();
  if(d.error){alert(d.error);return null;}
  return d;
}

/* ── чаты ────────────────────────────────────────────────────────── */
function renderChats(){
  const list=$('#chatList');list.replaceChildren();
  for(const c of state.chats||[]){
    const d=document.createElement('div');
    d.className='chat'+(c.active?' active':'');
    d.innerHTML='<div class="info"><div class="t"></div><div class="s"></div></div>'
               +'<span class="x">✕</span>';
    d.querySelector('.t').textContent=c.title||c.name;
    d.querySelector('.s').textContent=(c.pairs||0)+' пар'+(c.updated?' · '+c.updated:'');
    d.onclick=e=>{if(!e.target.classList.contains('x'))openChat(c.name);};
    d.ondblclick=e=>{e.stopPropagation();if(c.active)startRename(d,c);};
    d.querySelector('.x').onclick=async e=>{
      e.stopPropagation();
      if(!confirm('Удалить чат «'+(c.title||c.name)+'»? Это навсегда.'))return;
      const r=await post('/chat/delete',{session:c.name});
      if(r){apply(r);renderHistory(r.history);}
    };
    list.append(d);
  }
}
function startRename(el,c){
  const info=el.querySelector('.info');
  const было=info.innerHTML;
  const inp=document.createElement('input');
  inp.value=c.name;
  info.replaceChildren(inp);inp.focus();inp.select();
  const конец=async(сохранить)=>{
    const имя=inp.value.trim();
    info.innerHTML=было;
    if(!сохранить||!имя||имя===c.name)return;
    const r=await post('/chat/rename',{title:имя});
    if(r)apply(r);
  };
  inp.onkeydown=e=>{if(e.key==='Enter')конец(true);if(e.key==='Escape')конец(false);};
  inp.onblur=()=>конец(true);
}
async function openChat(имя){
  const d=await post('/session',{session:имя});
  if(!d)return;
  apply(d);renderHistory(d.history);sync();promptEl.focus();
}
async function newChat(){
  const занятые=new Set((state.chats||[]).map(c=>c.name));
  let n=занятые.size+1,имя='чат-'+n;
  while(занятые.has(имя))имя='чат-'+(++n);
  await openChat(имя);
}
window.newChat=newChat;

/* ── профиль ─────────────────────────────────────────────────────── */
const ПОДПИСИ={tone:'тон',format:'формат',level:'уровень',
               language:'язык',constraints:'ограничения'};
function renderProfile(){
  const sel=$('#profileSel');sel.replaceChildren();
  const пусто=document.createElement('option');
  пусто.value='';пусто.textContent='— без профиля —';
  пусто.selected=!state.profile;sel.append(пусто);
  for(const p of state.profiles||[]){
    const o=document.createElement('option');
    o.value=p.name;o.textContent=p.name;o.selected=p.name===state.profile;
    sel.append(o);
  }
  const box=$('#prefs');box.replaceChildren();
  const акт=(state.profiles||[]).find(p=>p.name===state.profile);
  if(!акт){
    box.append(Object.assign(document.createElement('div'),
      {className:'nothing',textContent:'профиль не выбран — агент отвечает как всем'}));
    return;
  }
  let было=false;
  for(const ключ of ['tone','format','level','language','constraints']){
    if(!акт[ключ])continue;
    было=true;
    const d=document.createElement('div');d.className='pref';
    d.innerHTML='<b></b><span></span>';
    d.firstElementChild.textContent=ПОДПИСИ[ключ];
    d.children[1].textContent=акт[ключ];
    box.append(d);
  }
  if(!было)box.append(Object.assign(document.createElement('div'),
    {className:'nothing',textContent:'профиль пустой'}));
}

/* ── память ──────────────────────────────────────────────────────── */
function item(k,v,onX,fresh){
  const d=document.createElement('div');
  d.className='item'+(fresh?' fresh':'');
  d.innerHTML='<span class="k"></span><span class="v"></span>';
  d.firstElementChild.textContent=k;d.children[1].textContent=v;
  if(onX){const x=document.createElement('span');x.className='x';x.textContent='✕';
    x.onclick=onX;d.append(x);}
  return d;
}
const ВИДЫ={profile:'профиль',decision:'решения',knowledge:'знания'};
function renderLayers(){
  const L=state.layers||{},s=L.short||{},w=L.working||{},l=L.long||{};
  $('#shortCount').textContent=(s['в окне']??0)+'/'+(s['потолок']??0);
  const si=$('#shortItems');si.replaceChildren();
  const реплики=(s.реплики||[]).slice(-5);
  if(!реплики.length)si.append(Object.assign(document.createElement('div'),
    {className:'nothing',textContent:'пока пусто'}));
  for(const r of реплики){
    const d=document.createElement('div');d.className='turn';
    d.innerHTML='<b></b> ';
    d.firstElementChild.textContent=r.role==='user'?'вы:':'агент:';
    d.append(r.content.slice(0,62));si.append(d);
  }
  const wi=$('#workItems');wi.replaceChildren();
  if(!(w.items||[]).length)wi.append(Object.assign(document.createElement('div'),
    {className:'nothing',textContent:'задача ещё не описана'}));
  for(const it of w.items||[])
    wi.append(item(it.key,it.value,null,свежие.working.includes(it.key)));
  const li=$('#longItems');li.replaceChildren();
  if(!(l.items||[]).length)li.append(Object.assign(document.createElement('div'),
    {className:'nothing',textContent:'агент вас ещё не знает'}));
  for(const вид of ['profile','decision','knowledge']){
    const гр=(l.items||[]).filter(x=>x.kind===вид);
    if(!гр.length)continue;
    const h=document.createElement('div');h.className='kind';h.textContent=ВИДЫ[вид];
    li.append(h);
    const box=document.createElement('div');box.className='items';
    for(const it of гр)
      box.append(item(it.key,it.value,async()=>{
        const d=await post('/forget',{key:it.key});if(d)apply(d);
      },свежие.long.includes(it.key)));
    li.append(box);
  }
}

function apply(next){
  if(!next)return;
  state={...state,...next};
  $('#model').textContent=state.model||'—';
  const чат=(state.chats||[]).find(c=>c.active);
  $('#chatTitle').textContent=чат?(чат.title||чат.name):'Ассистент';
  $('#subtitle').textContent=(state.profile?'профиль: '+state.profile+' · ':'')
    +(state.model||'');
  $('#tokens').textContent=(state.tokens||0).toLocaleString('ru');
  $('#spent').textContent=state.spent||'—';
  if(state.weigh){
    $('#weigh').textContent=(state.weigh.total||0).toLocaleString('ru');
    $('#wprof').textContent=(state.weigh.profile||0).toLocaleString('ru');
  }
  renderChats();renderProfile();renderLayers();
}

function renderHistory(h){
  transcript.replaceChildren();
  if(!h||!h.length){showEmpty();return;}
  for(const t of h){
    const b=addMsg(t.role==='user'?'me':'bot');
    if(t.role==='user')b.textContent=t.content;else b.innerHTML=md(t.content);
  }
  transcript.scrollTop=transcript.scrollHeight;
}

/* ── обычная отправка ────────────────────────────────────────────── */
async function send(){
  const message=promptEl.value.trim();
  if(!message||busy)return;
  busy=true;promptEl.value='';grow();sync();
  addMsg('me').textContent=message;
  const b=addMsg('bot');b.innerHTML='<div class="dots"><i></i><i></i><i></i></div>';
  scroll();
  let text='';
  try{
    const res=await fetch('/ask',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});
    const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){
      const {value,done}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let nl;
      while((nl=buf.indexOf('\n'))!==-1){
        const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);
        if(!line)continue;
        const m=JSON.parse(line);
        if(m.error)throw new Error(m.error);
        if(m.delta){text+=m.delta;b.classList.add('streaming');
          b.innerHTML=md(text);scroll();}
        if(m.done){
          свежие=m.новое||{working:[],long:[]};
          apply(m);
          const биты=[];
          if(state.profile)биты.push('профиль «'+state.profile+'»');
          if(свежие.working.length)биты.push('рабочая +'+свежие.working.length);
          if(свежие.long.length)биты.push('долговременная +'+свежие.long.length);
          if(биты.length){
            const el=document.createElement('div');el.className='meta';
            el.textContent=биты.join(' · ');b.parentElement.append(el);
          }
          setTimeout(()=>{свежие={working:[],long:[]};},1400);
        }
      }
    }
    b.classList.remove('streaming');
  }catch(err){
    b.classList.remove('streaming');b.classList.add('error');
    b.textContent=String(err.message||err);
  }finally{busy=false;sync();scroll();promptEl.focus();}
}

/* ── сравнение профилей ──────────────────────────────────────────── */
let сравнение=false;
async function startCompare(){
  if(сравнение)return;
  const вопрос=(promptEl.value.trim()
    ||(state.history||[]).filter(t=>t.role==='user').slice(-1)[0]?.content
    ||'').trim();
  if(!вопрос){
    alert('Напишите вопрос в поле ввода — он уйдёт всем профилям сразу.');
    promptEl.focus();return;
  }
  сравнение=true;
  $('#cmpQuestion').textContent='«'+вопрос+'»';
  const cols=$('#cmpCols');cols.replaceChildren();
  $('#overlay').classList.add('on');

  const колонки={};
  const создать=(имя,prefs)=>{
    const c=document.createElement('div');c.className='col';
    c.innerHTML='<h4'+(prefs?'':' class="plain"')+'><span class="dot"></span></h4>'
      +(prefs?'<div class="prefsbox"></div>':'')
      +'<div class="answer"><div class="dots"><i></i><i></i><i></i></div></div>'
      +'<footer>…</footer>';
    c.querySelector('h4').append(имя);
    if(prefs)c.querySelector('.prefsbox').textContent=prefs;
    cols.append(c);
    колонки[имя]={el:c,текст:''};
    return колонки[имя];
  };

  try{
    const res=await fetch('/compare',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:вопрос})});
    const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){
      const {value,done}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let nl;
      while((nl=buf.indexOf('\n'))!==-1){
        const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);
        if(!line)continue;
        const m=JSON.parse(line);
        if(m.start){создать(m.start,m.prefs||'');continue;}
        if(m.done){apply(m);continue;}
        const к=колонки[m.name];
        if(!к)continue;
        if(m.error){
          к.el.querySelector('.answer').textContent='Ошибка: '+m.error;continue;}
        if(m.delta){
          к.текст+=m.delta;
          к.el.querySelector('.answer').innerHTML=md(к.текст);
          continue;}
        if(m.end){
          к.el.querySelector('footer').textContent=
            m.chars+' знаков · '+m.tokens+' токенов · код: '+(m.code?'да':'нет');
        }
      }
    }
  }catch(err){
    alert('Сравнение не удалось: '+(err.message||err));
  }finally{сравнение=false;}
}
window.startCompare=startCompare;

function sync(){sendEl.disabled=busy||!promptEl.value.trim();}
function grow(){promptEl.style.height='auto';
  promptEl.style.height=promptEl.scrollHeight+'px';}

promptEl.addEventListener('input',()=>{grow();sync();});
promptEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
sendEl.addEventListener('click',send);
$('#newChatBtn').addEventListener('click',newChat);
$('#newChatNative').addEventListener('click',newChat);
$('#compareBtn').addEventListener('click',startCompare);
$('#compareNative').addEventListener('click',startCompare);
$('#cmpClose').addEventListener('click',()=>$('#overlay').classList.remove('on'));

$('#profileSel').addEventListener('change',async e=>{
  const d=await post('/profile/use',{name:e.target.value});if(d)apply(d);});
$('#profileDel').addEventListener('click',async()=>{
  if(!state.profile)return;
  if(!confirm('Удалить профиль «'+state.profile+'»?'))return;
  const d=await post('/profile/delete',{name:state.profile});if(d)apply(d);});
$('#pSave').addEventListener('click',async()=>{
  const имя=$('#pName').value.trim();
  if(!имя){alert('У профиля должно быть имя');return;}
  const d=await post('/profile/save',{name:имя,tone:$('#pTone').value,
    format:$('#pFormat').value,level:$('#pLevel').value,
    constraints:$('#pConstr').value});
  if(!d)return;
  for(const id of ['pName','pTone','pFormat','pLevel','pConstr'])$('#'+id).value='';
  const p=await post('/profile/use',{name:имя});if(p)apply(p);
});

$('#wAdd').addEventListener('click',async()=>{
  const k=$('#wKey').value.trim(),v=$('#wVal').value.trim();
  if(!k||!v)return;
  const d=await post('/remember',{key:k,value:v,layer:'working'});
  if(d){$('#wKey').value='';$('#wVal').value='';apply(d);}});
$('#lAdd').addEventListener('click',async()=>{
  const k=$('#lKey').value.trim(),v=$('#lVal').value.trim();
  if(!k||!v)return;
  const d=await post('/remember',{key:k,value:v,layer:'long',kind:$('#lKind').value});
  if(d){$('#lKey').value='';$('#lVal').value='';apply(d);}});

transcript.addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  promptEl.value=c.textContent;grow();sync();});

fetch('/state').then(r=>r.json())
  .then(d=>{apply(d);renderHistory(d.history);})
  .catch(()=>showEmpty());
</script>
