<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конвейер — пайплайн MCP-инструментов</title>
<style>
  :root{
    --chrome:rgba(246,246,246,.72);--canvas:#fff;--text:#1d1d1f;--muted:#86868b;
    --bubble:#e9e9eb;--field:#fff;--border:rgba(0,0,0,.12);
    --hairline:rgba(0,0,0,.08);--accent:#007aff;--code-bg:rgba(0,0,0,.05);
    --danger:#d70015;--danger-bg:rgba(215,0,21,.10);--sidebar:rgba(240,240,242,.86);
    --s1:#ff9f0a;--s2:#5e5ce6;--s3:#34c759;--tool:#5e5ce6;--tool-bg:rgba(94,92,230,.10);
    --desktop:linear-gradient(150deg,#8ea8d8 0%,#a99ad4 45%,#d3a2bd 100%);
    --shadow:0 22px 70px rgba(0,0,0,.30),0 2px 8px rgba(0,0,0,.14);
  }
  @media (prefers-color-scheme:dark){:root{
    --chrome:rgba(58,58,60,.72);--canvas:#1e1e1e;--text:#f5f5f7;--muted:#98989d;
    --bubble:#3a3a3c;--field:#2c2c2e;--border:rgba(255,255,255,.14);
    --hairline:rgba(255,255,255,.10);--accent:#0a84ff;--code-bg:rgba(255,255,255,.07);
    --danger:#ff6961;--danger-bg:rgba(255,105,97,.14);--sidebar:rgba(36,36,38,.86);
    --s1:#ffb340;--s2:#7d7aff;--s3:#30d158;--tool:#7d7aff;--tool-bg:rgba(125,122,255,.14);
    --desktop:linear-gradient(150deg,#1b2434 0%,#2a2340 50%,#3a2436 100%);
    --shadow:0 22px 70px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35);}}
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:grid;place-items:center;padding:20px 14px;
    background:var(--desktop);background-attachment:fixed;color:var(--text);
    font:13.5px/1.5 -apple-system,"SF Pro Text",BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased}
  .window{width:min(100%,1240px);height:min(100%,800px);display:flex;
    flex-direction:column;background:var(--canvas);border-radius:12px;
    box-shadow:var(--shadow),0 0 0 .5px var(--border);overflow:hidden}
  .titlebar{position:relative;flex:none;height:48px;display:flex;align-items:center;
    gap:7px;padding:0 13px;background:var(--chrome);
    border-bottom:.5px solid var(--hairline)}
  .lights{display:flex;gap:8px;margin-right:auto}
  .light{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
  .light.red{background:#ff5f57}.light.yellow{background:#febc2e}.light.green{background:#28c840}
  .titles{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    text-align:center;pointer-events:none}
  .titles b{display:block;font-size:13px;font-weight:600}
  .titles span{display:block;font-size:11px;color:var(--muted)}
  .btn{height:23px;padding:0 10px;font:inherit;font-size:12px;color:var(--text);
    background:var(--field);border:.5px solid var(--border);border-radius:6px;
    cursor:pointer;white-space:nowrap}
  .btn.go{background:var(--accent);border-color:transparent;color:#fff}
  .btn:disabled{opacity:.45;cursor:default}

  .body{flex:1;min-height:0;display:flex}
  .chats{flex:none;width:170px;background:var(--sidebar);
    border-right:.5px solid var(--hairline);display:flex;flex-direction:column}
  .chats header{flex:none;display:flex;align-items:center;padding:9px 10px 7px;
    font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;
    letter-spacing:.04em}
  .chats header button{margin-left:auto;width:22px;height:22px;display:grid;
    place-items:center;font-size:15px;line-height:1;color:var(--text);
    background:var(--field);border:.5px solid var(--border);border-radius:6px;
    cursor:pointer;padding:0}
  .chatlist{flex:1;min-height:0;overflow-y:auto;padding:0 7px 9px;
    display:flex;flex-direction:column;gap:2px}
  .chat{display:flex;align-items:center;gap:5px;padding:6px 8px;border-radius:7px;
    cursor:pointer;border:.5px solid transparent}
  .chat:hover{background:var(--field)}
  .chat.active{background:var(--field);border-color:var(--border)}
  .chat .info{flex:1;min-width:0}
  .chat .t{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chat.active .t{font-weight:600}
  .chat .s{font-size:10px;color:var(--muted)}
  .chat .x{flex:none;opacity:0;color:var(--muted);font-size:12px;padding:0 2px}
  .chat:hover .x{opacity:.55}
  .chat .x:hover{opacity:1;color:var(--danger)}
  .chat input{width:100%;font:inherit;font-size:12px;padding:1px 4px;
    background:var(--canvas);border:.5px solid var(--accent);border-radius:4px;
    color:var(--text);outline:none}
  .hint{padding:0 10px 9px;font-size:10px;color:var(--muted);line-height:1.35}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}

  /* ── конвейер: главное в этом дне ──────────────────────────────── */
  .runner{flex:none;padding:11px 14px;background:var(--chrome);
    border-bottom:.5px solid var(--hairline)}
  .runner .row{display:flex;gap:7px;align-items:center}
  .runner input{flex:1;font:inherit;font-size:12.5px;padding:6px 11px;
    background:var(--field);border:.5px solid var(--border);border-radius:8px;
    color:var(--text);outline:none}
  .runner input.fn{flex:0 0 160px}
  .runner input:focus{border-color:var(--accent)}
  .steps{display:flex;align-items:stretch;gap:0;margin-top:11px}
  .step{flex:1;min-width:0;background:var(--field);border:.5px solid var(--border);
    border-radius:9px;padding:8px 10px;font-size:11.5px;opacity:.45;
    transition:opacity .2s,border-color .2s}
  .step.active{opacity:1;border-color:var(--accent)}
  .step.done{opacity:1}
  .step.done.s1{border-color:var(--s1)}
  .step.done.s2{border-color:var(--s2)}
  .step.done.s3{border-color:var(--s3)}
  .step .nm{font-weight:650;font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:11px}
  .step.s1 .nm{color:var(--s1)}.step.s2 .nm{color:var(--s2)}.step.s3 .nm{color:var(--s3)}
  .step .st{color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
  .step .num{margin-top:4px;font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:10.5px;color:var(--text)}
  .step .sha{color:var(--muted);font-size:10px}
  .arrow{flex:0 0 34px;display:grid;place-items:center;color:var(--muted);
    font-size:15px}
  .arrow b{font-size:9px;display:block;text-align:center;color:var(--muted);
    font-weight:400;margin-top:-3px}

  .transcript{flex:1;min-height:0;overflow-y:auto;padding:15px;
    display:flex;flex-direction:column;gap:10px}
  .msg{display:flex;flex-direction:column}
  .msg.me{align-items:flex-end}.msg.bot{align-items:flex-start}
  .bubble{max-width:88%;padding:8px 13px;border-radius:17px;overflow-wrap:anywhere}
  .me .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:5px;
    white-space:pre-wrap}
  .bot .bubble{background:var(--bubble);border-bottom-left-radius:5px}
  .bot .bubble.error{background:var(--danger-bg);color:var(--danger)}
  .bubble p{margin:.5em 0}.bubble>:first-child{margin-top:0}
  .bubble>:last-child{margin-bottom:0}
  .bubble ul,.bubble ol{margin:.5em 0;padding-left:1.3em}
  .bubble code{font:12px/1.4 ui-monospace,"SF Mono",Menlo,monospace;
    background:var(--code-bg);padding:.1em .3em;border-radius:4px}
  .bubble pre{margin:.5em 0;padding:9px 11px;background:var(--code-bg);
    border-radius:8px;overflow-x:auto}
  .call{max-width:88%;background:var(--tool-bg);
    border:.5px solid color-mix(in srgb,var(--tool) 40%,transparent);
    border-radius:10px;padding:7px 11px;font-size:12px}
  .call.failed{background:var(--danger-bg);
    border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
  .call .head{font-weight:650;color:var(--tool)}
  .call .args{font:11.5px/1.4 ui-monospace,"SF Mono",Menlo,monospace;
    color:var(--muted);margin-top:2px}
  .call .prev{margin-top:5px;padding-top:5px;
    border-top:.5px solid color-mix(in srgb,var(--tool) 22%,transparent);
    font:11.5px/1.45 ui-monospace,"SF Mono",Menlo,monospace;opacity:.8;
    white-space:pre-wrap}
  .note{max-width:88%;font-size:11.5px;color:var(--muted);
    background:var(--code-bg);border-radius:8px;padding:6px 10px}
  .note b{color:var(--text)}
  .thinking{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
  .dots{display:flex;gap:4px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);
    animation:bounce 1.25s ease-in-out infinite}
  .dots i:nth-child(2){animation-delay:.16s}.dots i:nth-child(3){animation-delay:.32s}
  @keyframes bounce{0%,60%,100%{opacity:.3}30%{opacity:1;transform:translateY(-3px)}}
  .empty{margin:auto;text-align:center;max-width:460px;color:var(--muted)}
  .empty .glyph{font-size:27px;opacity:.5}
  .empty h2{margin:8px 0 4px;font-size:16px;font-weight:600;color:var(--text)}
  .empty p{margin:0;font-size:12.5px}
  .composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:9px 12px;
    background:var(--chrome);border-top:.5px solid var(--hairline)}
  .composer textarea{flex:1;resize:none;max-height:100px;padding:7px 12px;font:inherit;
    color:var(--text);background:var(--field);border:.5px solid var(--border);
    border-radius:16px;outline:none}
  .send{flex:none;width:30px;height:30px;display:grid;place-items:center;font-size:15px;
    color:#fff;background:var(--accent);border:0;border-radius:50%;cursor:pointer}
  .send:disabled{background:var(--bubble);color:var(--muted);cursor:default}

  .side{flex:none;width:286px;border-left:.5px solid var(--hairline);
    background:var(--chrome);display:flex;flex-direction:column;overflow-y:auto}
  .side>header{flex:none;display:flex;align-items:center;padding:10px 12px 6px;
    font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;
    letter-spacing:.04em}
  .side>header button{margin-left:auto;font:inherit;font-size:10.5px;
    text-transform:none;letter-spacing:0;padding:2px 7px;background:var(--field);
    border:.5px solid var(--border);border-radius:5px;color:var(--muted);
    cursor:pointer}
  .art{margin:0 10px 5px;padding:7px 9px;background:var(--field);
    border:.5px solid var(--border);border-radius:7px;font-size:11.5px;
    cursor:pointer}
  .art:hover{border-color:var(--accent)}
  .art .top{display:flex;align-items:baseline;gap:5px}
  .art .id{font-weight:700;font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .art.search .id{color:var(--s1)}.art.summary .id{color:var(--s2)}
  .art.file .id{color:var(--s3)}
  .art .kind{font-size:10px;color:var(--muted)}
  .art .from{margin-left:auto;font-size:10px;color:var(--muted)}
  .art .ti{margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .art .meta{margin-top:2px;font-size:10px;color:var(--muted);
    font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .nothing{font-size:11px;color:var(--muted);font-style:italic;padding:2px 12px}
  details.kat{border-top:.5px solid var(--hairline);margin-top:6px}
  details.kat>summary{padding:8px 12px;font-size:11.5px;cursor:pointer;
    list-style:none;color:var(--text)}
  details.kat>summary::-webkit-details-marker{display:none}
  details.kat>summary::before{content:'▸ ';color:var(--muted)}
  details.kat[open]>summary::before{content:'▾ '}
  details.kat .inner{padding:0 12px 10px;font-size:11px}
  .tool{margin-bottom:5px;padding:6px 8px;background:var(--field);
    border:.5px solid var(--border);border-radius:6px}
  .tool .n{font-weight:650;color:var(--tool);
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px}
  .tool .d{color:var(--muted);font-size:10.5px;margin-top:2px}

  .statusbar{flex:none;display:flex;gap:12px;flex-wrap:wrap;padding:6px 13px;
    font-size:11px;color:var(--muted);background:var(--chrome);
    border-top:.5px solid var(--hairline)}
  .statusbar b{color:var(--text);font-weight:600}
  .native body{display:block;padding:0;background:var(--canvas)}
  .native .window{width:100%;height:100%;border-radius:0;box-shadow:none}
  .native .titlebar{display:none}
  @media (max-width:1100px){.side{width:248px}.chats{width:146px}}
</style>
</head>
<body>

<div class="window">
  <header class="titlebar">
    <div class="lights"><span class="light red"></span><span class="light yellow"></span><span class="light green"></span></div>
    <div class="titles"><b id="chatTitle">Конвейер</b><span id="subtitle">—</span></div>
  </header>

  <div class="body">
    <nav class="chats">
      <header>Чаты <button id="newChatBtn" title="Новый чат">+</button></header>
      <div class="chatlist" id="chatList"></div>
      <div class="hint">двойной клик — переименовать<br>✕ — удалить</div>
    </nav>

    <div class="main">
      <div class="runner">
        <div class="row">
          <input id="pQuery" placeholder="Что искать в репозитории — например, MCP">
          <input id="pFile" class="fn" placeholder="имя файла">
          <button class="btn go" id="pRun">Запустить пайплайн</button>
        </div>
        <div class="steps" id="steps"></div>
      </div>

      <div class="transcript" id="transcript"></div>
      <footer class="composer">
        <textarea id="prompt" rows="1" placeholder="Или попросите словами: найди про планировщик, сожми и сохрани…"></textarea>
        <button class="send" id="send" disabled title="Отправить (Enter)">↑</button>
      </footer>
    </div>

    <aside class="side">
      <header>Артефакты <button id="clearArt">очистить</button></header>
      <div id="artList"></div>
      <details class="kat">
        <summary>Инструменты MCP</summary>
        <div class="inner" id="toolList"></div>
      </details>
    </aside>
  </div>

  <div class="statusbar">
    <span>модель <b id="model">—</b></span>
    <span>артефактов <b id="sArt">0</b></span>
    <span>токенов <b id="tokens">0</b></span>
    <span>потрачено <b id="spent">—</b></span>
  </div>
</div>

<template id="emptyTpl">
  <div class="empty">
    <div class="glyph">⛓</div>
    <h2>Пайплайн инструментов</h2>
    <p>Три шага: найти → сжать → сохранить. Инструменты передают друг другу
       не данные, а номера артефактов — данные не проходят через модель
       и не искажаются.</p>
  </div>
</template>

<script>
const $=s=>document.querySelector(s);
const transcript=$('#transcript'),promptEl=$('#prompt'),sendEl=$('#send');
let busy=false,state={};

if(new URLSearchParams(location.search).has('native'))
  document.documentElement.classList.add('native');

const ШАГИ=[{n:1,tool:'search',имя:'search',подпись:'найти'},
            {n:2,tool:'summarize',имя:'summarize',подпись:'сжать'},
            {n:3,tool:'save_to_file',имя:'save_to_file',подпись:'сохранить'}];

function md(src){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if(((src.match(/```/g)||[]).length)%2) src+='\n```';
  const blocks=[];
  src=src.replace(/```[a-zA-Z0-9+#.-]*\n?([\s\S]*?)```/g,(_,b)=>{
    blocks.push('<pre><code>'+esc(b.replace(/\n+$/,''))+'</code></pre>');
    return '\n@@C'+(blocks.length-1)+'@@\n';});
  const inl=s=>esc(s).replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  const out=[];let list=null;
  const close=()=>{if(list){out.push('</'+list+'>');list=null;}};
  for(const raw of src.split('\n')){
    const l=raw.trim();const p=l.match(/^@@C(\d+)@@$/);
    if(p){close();out.push(blocks[+p[1]]);continue;}
    if(!l){close();continue;}
    const b=l.match(/^[-*•]\s+(.*)$/),n=l.match(/^\d+[.)]\s+(.*)$/);
    if(b||n){const w=b?'ul':'ol';if(list!==w){close();out.push('<'+w+'>');list=w;}
      out.push('<li>'+inl((b||n)[1])+'</li>');continue;}
    close();out.push('<p>'+inl(l)+'</p>');
  }
  close();return out.join('');
}
function showEmpty(){transcript.replaceChildren($('#emptyTpl').content.cloneNode(true));}
function addMsg(who){
  const e=$('.empty');if(e)e.remove();
  const d=document.createElement('div');d.className='msg '+who;
  d.innerHTML='<div class="bubble"></div>';transcript.append(d);
  return d.firstElementChild;
}
function addNote(html){
  const e=$('.empty');if(e)e.remove();
  const d=document.createElement('div');d.className='note';d.innerHTML=html;
  transcript.append(d);scroll();return d;
}
const scroll=()=>transcript.scrollTo({top:transcript.scrollHeight,behavior:'smooth'});
async function post(url,body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body||{})});
  const d=await r.json();
  if(d.error){alert(d.error);return null;}
  return d;
}

/* ── полоса шагов ──────────────────────────────────────────────── */
function renderSteps(состояния){
  const box=$('#steps');box.replaceChildren();
  ШАГИ.forEach((ш,i)=>{
    if(i){
      const a=document.createElement('div');a.className='arrow';
      a.innerHTML='→<b>номер</b>';box.append(a);
    }
    const с=(состояния||{})[ш.n]||{};
    const d=document.createElement('div');
    d.className=`step s${ш.n} ${с.state==='готово'?'done':(с.state==='идёт'?'active':'')}`;
    d.innerHTML='<div class="nm"></div><div class="st"></div>'
      +'<div class="num"></div>';
    d.querySelector('.nm').textContent=`${ш.n}. ${ш.имя}`;
    d.querySelector('.st').textContent=с.note||ш.подпись;
    const num=d.querySelector('.num');
    if(с.artifact){
      num.innerHTML=`#${с.artifact.id} · ${с.artifact.length.toLocaleString('ru')} знаков`
        +`<div class="sha">sha ${с.artifact.sha}</div>`;
    }else num.remove();
    box.append(d);
  });
}

/* ── артефакты ─────────────────────────────────────────────────── */
function renderArtifacts(){
  const box=$('#artList');box.replaceChildren();
  const список=state.artifacts||[];
  if(!список.length){
    box.append(Object.assign(document.createElement('div'),
      {className:'nothing',textContent:'артефактов нет — запустите пайплайн'}));
    return;
  }
  for(const а of список){
    const d=document.createElement('div');
    d.className='art '+а.kind;
    d.innerHTML='<div class="top"><span class="id"></span>'
      +'<span class="kind"></span><span class="from"></span></div>'
      +'<div class="ti"></div><div class="meta"></div>';
    d.querySelector('.id').textContent='#'+а.id;
    d.querySelector('.kind').textContent=а.kind;
    const from=d.querySelector('.from');
    if(а.source_id)from.textContent='← #'+а.source_id; else from.remove();
    d.querySelector('.ti').textContent=а.title;
    d.querySelector('.meta').textContent=
      `${а.length.toLocaleString('ru')} знаков · sha ${а.sha}`;
    d.onclick=async()=>{
      const полный=await fetch('/artifact/'+а.id).then(r=>r.json());
      if(полный.error){alert(полный.error);return;}
      addNote(`<b>#${полный.id} ${полный.title}</b><br>`
        +`${полный.length} знаков, sha ${полный.sha}, инструмент ${полный.tool}`
        +`<br><br>${полный.content.slice(0,900).replace(/[<>&]/g,
            c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}`
        +(полный.length>900?'…':''));
    };
    box.append(d);
  }
}
function renderTools(){
  const box=$('#toolList');box.replaceChildren();
  for(const t of state.tools||[]){
    const d=document.createElement('div');d.className='tool';
    d.innerHTML='<div class="n"></div><div class="d"></div>';
    d.querySelector('.n').textContent=t.name;
    d.querySelector('.d').textContent=(t.description||'').slice(0,80);
    box.append(d);}
}

/* ── чаты ──────────────────────────────────────────────────────── */
function renderChats(){
  const list=$('#chatList');list.replaceChildren();
  for(const c of state.chats||[]){
    const d=document.createElement('div');
    d.className='chat'+(c.active?' active':'');
    d.innerHTML='<div class="info"><div class="t"></div><div class="s"></div></div>'
               +'<span class="x">✕</span>';
    d.querySelector('.t').textContent=c.title||c.name;
    d.querySelector('.s').textContent=(c.pairs||0)+' пар';
    d.onclick=e=>{if(!e.target.classList.contains('x'))openChat(c.name);};
    d.ondblclick=e=>{e.stopPropagation();if(c.active)startRename(d,c);};
    d.querySelector('.x').onclick=async e=>{
      e.stopPropagation();
      if(!confirm('Удалить чат «'+(c.title||c.name)+'»?'))return;
      const r=await post('/chat/delete',{session:c.name});
      if(r){apply(r);renderHistory(r.history);}};
    list.append(d);}
}
function startRename(el,c){
  const info=el.querySelector('.info');const было=info.innerHTML;
  const inp=document.createElement('input');inp.value=c.name;
  info.replaceChildren(inp);inp.focus();inp.select();
  const конец=async(сохранить)=>{
    const имя=inp.value.trim();info.innerHTML=было;
    if(!сохранить||!имя||имя===c.name)return;
    const r=await post('/chat/rename',{title:имя});if(r)apply(r);};
  inp.onkeydown=e=>{if(e.key==='Enter')конец(true);if(e.key==='Escape')конец(false);};
  inp.onblur=()=>конец(true);
}
async function openChat(имя){
  const d=await post('/session',{session:имя});
  if(!d)return;apply(d);renderHistory(d.history);sync();promptEl.focus();}
async function newChat(){
  const занятые=new Set((state.chats||[]).map(c=>c.name));
  let n=занятые.size+1,имя='чат-'+n;
  while(занятые.has(имя))имя='чат-'+(++n);
  await openChat(имя);}
window.newChat=newChat;

function addCall(t){
  const e=$('.empty');if(e)e.remove();
  const d=document.createElement('div');
  d.className='call'+(t.failed?' failed':'');
  d.innerHTML='<div class="head"></div><div class="args"></div><div class="prev"></div>';
  d.querySelector('.head').textContent='🔧 '+t.name+(t.failed?' — ошибка':'');
  const пары=Object.entries(t.args||{});
  d.querySelector('.args').textContent=пары.length
    ? пары.map(([k,v])=>k+': '+JSON.stringify(v)).join(', '):'без аргументов';
  const пред=(t.preview||[]).join('\n');
  const prev=d.querySelector('.prev');
  if(пред)prev.textContent=пред;else prev.remove();
  transcript.append(d);scroll();
}

function apply(next){
  if(!next)return;
  state={...state,...next};
  $('#model').textContent=state.model||'—';
  const чат=(state.chats||[]).find(c=>c.active);
  $('#chatTitle').textContent=чат?(чат.title||чат.name):'Конвейер';
  $('#subtitle').textContent=state.mcp||'';
  $('#sArt').textContent=(state.artifacts||[]).length;
  $('#tokens').textContent=(state.tokens||0).toLocaleString('ru');
  $('#spent').textContent=state.spent||'—';
  renderChats();renderArtifacts();renderTools();
}
function renderHistory(h){
  transcript.replaceChildren();
  if(!h||!h.length){showEmpty();return;}
  for(const t of h){
    const b=addMsg(t.role==='user'?'me':'bot');
    if(t.role==='user')b.textContent=t.content;else b.innerHTML=md(t.content);}
  transcript.scrollTop=transcript.scrollHeight;
}

/* ── запуск пайплайна ──────────────────────────────────────────── */
async function runPipeline(){
  const запрос=$('#pQuery').value.trim();
  if(!запрос||busy){if(!запрос)$('#pQuery').focus();return;}
  busy=true;$('#pRun').disabled=true;sync();
  const состояния={};renderSteps(состояния);
  addNote(`<b>Пайплайн:</b> «${запрос}» — search → summarize → save_to_file`);
  try{
    const res=await fetch('/pipeline',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({query:запрос,filename:$('#pFile').value})});
    const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){
      const {value,done}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let nl;
      while((nl=buf.indexOf('\n'))!==-1){
        const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);
        if(!line)continue;
        const m=JSON.parse(line);
        if(m.error){addNote(`<b style="color:var(--danger)">Ошибка:</b> ${m.error}`);break;}
        if(m.step){
          состояния[m.step.n]=m.step;renderSteps(состояния);
          if(m.step.state==='готово'&&m.step.artifact){
            const а=m.step.artifact;
            let текст=`<b>${m.step.n}. ${m.step.tool}</b> → артефакт #${а.id}, `
              +`${а.length.toLocaleString('ru')} знаков, sha ${а.sha}`;
            if(m.step.input_sha)
              текст+=`<br>вход: #${а.source_id} (${m.step.input_len} знаков, `
                +`sha ${m.step.input_sha}) — взят по номеру, не через модель`;
            if(m.step.path)текст+=`<br>файл: ${m.step.path}`;
            addNote(текст);
          }
        }
        if(m.done){
          apply(m);
          if(m.chain&&m.chain.length>1){
            const путь=m.chain.map(а=>`#${а.id} ${а.kind} (${а.length})`).join(' → ');
            addNote(`<b>Цепочка целиком:</b> ${путь}`);
          }
        }
      }
    }
  }catch(err){addNote(`<b style="color:var(--danger)">Сбой:</b> ${err.message||err}`);
  }finally{busy=false;$('#pRun').disabled=false;sync();}
}

async function send(){
  const message=promptEl.value.trim();
  if(!message||busy)return;
  busy=true;promptEl.value='';grow();sync();
  addMsg('me').textContent=message;
  const ждём=document.createElement('div');ждём.className='thinking';
  ждём.innerHTML='<div class="dots"><i></i><i></i><i></i></div><span>думает…</span>';
  transcript.append(ждём);scroll();
  try{
    const res=await fetch('/ask',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});
    const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){
      const {value,done}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let nl;
      while((nl=buf.indexOf('\n'))!==-1){
        const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);
        if(!line)continue;
        const m=JSON.parse(line);
        if(m.error){ждём.remove();const b=addMsg('bot');
          b.classList.add('error');b.textContent=m.error;break;}
        if(m.tool){ждём.querySelector('span').textContent='вызывает инструменты…';
          addCall(m.tool);}
        if(m.answer!==undefined){ждём.remove();
          addMsg('bot').innerHTML=md(m.answer||'(пусто)');scroll();}
        if(m.done)apply(m);
      }
    }
    ждём.remove();
  }catch(err){ждём.remove();const b=addMsg('bot');
    b.classList.add('error');b.textContent=String(err.message||err);
  }finally{busy=false;sync();scroll();promptEl.focus();}
}

function sync(){sendEl.disabled=busy||!promptEl.value.trim();}
function grow(){promptEl.style.height='auto';
  promptEl.style.height=promptEl.scrollHeight+'px';}
promptEl.addEventListener('input',()=>{grow();sync();});
promptEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
sendEl.addEventListener('click',send);
$('#pRun').addEventListener('click',runPipeline);
$('#pQuery').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();runPipeline();}});
$('#newChatBtn').addEventListener('click',newChat);
$('#clearArt').addEventListener('click',async()=>{
  if(!confirm('Удалить все артефакты?'))return;
  const r=await post('/artifacts/clear');
  if(r){apply(r);renderSteps({});}});

renderSteps({});
fetch('/state').then(r=>r.json())
  .then(d=>{apply(d);renderHistory(d.history);})
  .catch(()=>showEmpty());
</script>
