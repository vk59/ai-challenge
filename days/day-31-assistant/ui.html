<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ассистент разработчика</title>
<style>
  :root{
    --chrome:rgba(246,246,246,.72);--canvas:#fff;--text:#1d1d1f;--muted:#86868b;
    --bubble:#e9e9eb;--field:#fff;--border:rgba(0,0,0,.12);
    --hairline:rgba(0,0,0,.08);--accent:#007aff;--code-bg:rgba(0,0,0,.05);
    --danger:#d70015;--danger-bg:rgba(215,0,21,.10);--sidebar:rgba(240,240,242,.86);
    --ok:#34c759;--warn:#ff9f0a;--git:#ff9f0a;--docs:#5e5ce6;
    --desktop:linear-gradient(150deg,#8ea8d8 0%,#a99ad4 45%,#d3a2bd 100%);
    --shadow:0 22px 70px rgba(0,0,0,.30),0 2px 8px rgba(0,0,0,.14);
  }
  @media (prefers-color-scheme:dark){:root{
    --chrome:rgba(58,58,60,.72);--canvas:#1e1e1e;--text:#f5f5f7;--muted:#98989d;
    --bubble:#3a3a3c;--field:#2c2c2e;--border:rgba(255,255,255,.14);
    --hairline:rgba(255,255,255,.10);--accent:#0a84ff;--code-bg:rgba(255,255,255,.07);
    --danger:#ff6961;--danger-bg:rgba(255,105,97,.14);--sidebar:rgba(36,36,38,.86);
    --ok:#30d158;--warn:#ffb340;--git:#ffb340;--docs:#7d7aff;
    --desktop:linear-gradient(150deg,#1b2434 0%,#2a2340 50%,#3a2436 100%);
    --shadow:0 22px 70px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35);}}
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:grid;place-items:center;padding:20px 14px;
    background:var(--desktop);background-attachment:fixed;color:var(--text);
    font:13.5px/1.5 -apple-system,"SF Pro Text",BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased}
  .window{width:min(100%,1340px);height:min(100%,850px);display:flex;
    flex-direction:column;background:var(--canvas);border-radius:12px;
    box-shadow:var(--shadow),0 0 0 .5px var(--border);overflow:hidden}
  .titlebar{position:relative;flex:none;height:48px;display:flex;align-items:center;
    gap:7px;padding:0 13px;background:var(--chrome);
    border-bottom:.5px solid var(--hairline)}
  .lights{display:flex;gap:8px;margin-right:auto}
  .light{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
  .light.red{background:#ff5f57}.light.yellow{background:#febc2e}.light.green{background:#28c840}
  .titles{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    text-align:center;pointer-events:none}
  .titles b{display:block;font-size:13px;font-weight:600}
  .titles span{display:block;font-size:11px;color:var(--muted)}
  .btn{height:25px;padding:0 11px;font:inherit;font-size:12px;color:var(--text);
    background:var(--field);border:.5px solid var(--border);border-radius:6px;
    cursor:pointer;white-space:nowrap}
  .btn:disabled{opacity:.45;cursor:default}

  .body{flex:1;min-height:0;display:flex}
  .aside{flex:none;width:252px;background:var(--sidebar);
    border-right:.5px solid var(--hairline);display:flex;flex-direction:column;
    overflow-y:auto}
  .aside header{flex:none;display:flex;align-items:center;padding:9px 11px 6px;
    font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;
    letter-spacing:.04em}
  .aside header button{margin-left:auto;font:inherit;font-size:10.5px;
    text-transform:none;letter-spacing:0;padding:1px 6px;background:var(--field);
    border:.5px solid var(--border);border-radius:5px;color:var(--muted);
    cursor:pointer}
  .live{margin:0 10px 8px;padding:8px 10px;background:var(--field);
    border:.5px solid var(--border);border-radius:8px;font-size:11.5px;
    border-left:3px solid var(--git)}
  .live .ttl{font-size:10px;text-transform:uppercase;letter-spacing:.03em;
    font-weight:700;color:var(--git);margin-bottom:3px}
  .live pre{margin:0;font:11px/1.45 ui-monospace,"SF Mono",Menlo,monospace;
    white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
  .qlist{padding:0 8px 8px;display:flex;flex-direction:column;gap:2px}
  .qlist div{padding:5px 8px;border-radius:6px;cursor:pointer;font-size:11.5px;
    border:.5px solid transparent;display:flex;gap:5px;align-items:baseline}
  .qlist div:hover{background:var(--field);border-color:var(--border)}
  .qlist div .k{flex:none;font-size:9.5px;padding:1px 5px;border-radius:7px;
    font-weight:700;text-transform:uppercase}
  .qlist div .k.state{background:rgba(255,159,10,.20);color:var(--git)}
  .qlist div .k.docs{background:rgba(94,92,230,.18);color:var(--docs)}
  .qlist div .k.both{background:rgba(52,199,89,.18);color:var(--ok)}
  .qlist div span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tools{padding:0 11px 9px;font-size:10.5px}
  .tools div{padding:1px 0;font-family:ui-monospace,"SF Mono",Menlo,monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tools div.state{color:var(--git)}
  .tools div.hist{color:var(--muted)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .pane{flex:1;min-height:0;overflow-y:auto;padding:14px;
    display:flex;flex-direction:column;gap:9px}
  .msg{display:flex;flex-direction:column}
  .msg.me{align-items:flex-end}.msg.bot{align-items:flex-start}
  .bubble{max-width:88%;padding:9px 13px;border-radius:17px;
    overflow-wrap:anywhere;white-space:pre-wrap}
  .me .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:5px}
  .bot .bubble{background:var(--bubble);border-bottom-left-radius:5px}
  .bot .bubble.err{background:var(--danger-bg);color:var(--danger)}
  /* Откуда взят ответ — главное в этом дне. */
  .from{max-width:88%;display:flex;gap:6px;flex-wrap:wrap;padding:0 4px}
  .from .chip{font-size:11px;padding:2px 9px;border-radius:11px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .from .chip.git{background:rgba(255,159,10,.18);color:var(--git);
    font-weight:650}
  .from .chip.doc{background:rgba(94,92,230,.14);color:var(--docs)}
  .from .chip.none{background:var(--code-bg);color:var(--muted)}
  .verdict{max-width:88%;font-size:11.5px;padding:3px 9px;border-radius:7px}
  .verdict.ok{background:rgba(52,199,89,.15);color:var(--ok)}
  .verdict.no{background:var(--danger-bg);color:var(--danger)}
  .meta{max-width:88%;font-size:10.5px;color:var(--muted);padding:0 10px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .thinking{display:flex;gap:7px;align-items:center;font-size:12px;
    color:var(--muted);padding:3px 10px}
  .dots{display:flex;gap:4px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);
    animation:bounce 1.25s ease-in-out infinite}
  .dots i:nth-child(2){animation-delay:.16s}.dots i:nth-child(3){animation-delay:.32s}
  @keyframes bounce{0%,60%,100%{opacity:.3}30%{opacity:1;transform:translateY(-3px)}}
  .empty{margin:auto;text-align:center;max-width:480px;color:var(--muted)}
  .empty .glyph{font-size:27px;opacity:.5}
  .empty h2{margin:8px 0 4px;font-size:16px;font-weight:600;color:var(--text)}
  .empty p{margin:0;font-size:12.5px}
  .composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:9px 12px;
    background:var(--chrome);border-top:.5px solid var(--hairline)}
  .composer .slash{flex:none;font-size:12px;color:var(--muted);
    font-family:ui-monospace,"SF Mono",Menlo,monospace;padding-bottom:9px}
  .composer textarea{flex:1;resize:none;max-height:100px;padding:7px 12px;font:inherit;
    color:var(--text);background:var(--field);border:.5px solid var(--border);
    border-radius:16px;outline:none}
  .send{flex:none;width:30px;height:30px;display:grid;place-items:center;font-size:15px;
    color:#fff;background:var(--accent);border:0;border-radius:50%;cursor:pointer}
  .send:disabled{background:var(--bubble);color:var(--muted);cursor:default}
  .tools-row{flex:none;display:flex;gap:6px;align-items:center;padding:0 12px 9px;
    background:var(--chrome);flex-wrap:wrap}
  .tools-row label{display:flex;gap:4px;align-items:center;font-size:11.5px;
    padding:3px 8px;background:var(--field);border:.5px solid var(--border);
    border-radius:13px;cursor:pointer}
  .tools-row .sp{flex:1}

  table.t{width:100%;border-collapse:collapse;font-size:12px}
  table.t th,table.t td{padding:4px 7px;text-align:left;
    border-bottom:.5px solid var(--hairline)}
  table.t th{font-size:10.5px;color:var(--muted);font-weight:600;
    text-transform:uppercase;letter-spacing:.03em}
  table.t td.mid{text-align:center}
  table.t td.num{text-align:right;font-variant-numeric:tabular-nums;
    font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .tick{font-weight:700}.tick.yes{color:var(--ok)}.tick.no{color:var(--danger)}
  .sum{margin-top:11px;padding:10px 13px;background:var(--code-bg);
    border-radius:9px;font-size:12.5px}
  .sum table{width:100%;border-collapse:collapse}
  .sum td{padding:3px 0}
  .sum td+td{text-align:right;font-weight:700;
    font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .err{background:var(--danger-bg);color:var(--danger);padding:8px 11px;
    border-radius:8px;font-size:12px}

  .statusbar{flex:none;display:flex;gap:12px;flex-wrap:wrap;padding:6px 13px;
    font-size:11px;color:var(--muted);background:var(--chrome);
    border-top:.5px solid var(--hairline)}
  .statusbar b{color:var(--text);font-weight:600}
  .native body{display:block;padding:0;background:var(--canvas)}
  .native .window{width:100%;height:100%;border-radius:0;box-shadow:none}
  .native .titlebar{display:none}
  @media (max-width:1150px){.aside{width:206px}}
</style>
</head>
<body>

<div class="window">
  <header class="titlebar">
    <div class="lights"><span class="light red"></span><span class="light yellow"></span><span class="light green"></span></div>
    <div class="titles"><b>Ассистент разработчика</b><span id="subtitle">—</span></div>
  </header>

  <div class="body">
    <nav class="aside">
      <header>Проект сейчас <button id="refresh">обновить</button></header>
      <div id="live"></div>
      <header>Примеры вопросов</header>
      <div class="qlist" id="qlist"></div>
      <header>Инструменты MCP</header>
      <div class="tools" id="toollist"></div>
    </nav>

    <div class="main">
      <div class="pane" id="pane"></div>
      <div class="tools-row">
        <label><input type="checkbox" id="local">на локальной модели</label>
        <span class="sp"></span>
        <button class="btn" id="check">Прогнать 9 вопросов</button>
        <button class="btn" id="clear">Очистить</button>
      </div>
      <footer class="composer">
        <span class="slash">/help</span>
        <textarea id="msg" rows="1" placeholder="вопрос о проекте — хоть про ветку, хоть про устройство…"></textarea>
        <button class="send" id="send" disabled title="Отправить (Enter)">↑</button>
      </footer>
    </div>
  </div>

  <div class="statusbar">
    <span>документы <b id="ix">—</b></span>
    <span>MCP <b id="mcp">—</b></span>
    <span id="hint"></span>
  </div>
</div>

<template id="emptyTpl">
  <div class="empty">
    <div class="glyph">🧭</div>
    <h2>Документы объясняют, git показывает</h2>
    <p>Спросите «в какой я ветке» — ассистент пойдёт в git. Спросите
       «почему сжатие бывает дороже» — в документацию. Под каждым ответом
       видно, откуда он взят: оранжевым инструменты git, сиреневым
       выдержки из документов.</p>
  </div>
</template>

<script>
const $=s=>document.querySelector(s);
const pane=$('#pane'),msgEl=$('#msg'),sendEl=$('#send');
let busy=false,state={};

if(new URLSearchParams(location.search).has('native'))
  document.documentElement.classList.add('native');

const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;');
const num=n=>(n??0).toLocaleString('ru');
const scroll=()=>pane.scrollTo({top:pane.scrollHeight,behavior:'smooth'});

function showEmpty(){pane.replaceChildren($('#emptyTpl').content.cloneNode(true));}
function addMsg(who,kind){
  const e=pane.querySelector('.empty');if(e)e.remove();
  const d=document.createElement('div');d.className='msg '+who;
  d.innerHTML='<div class="bubble'+(kind?' '+kind:'')+'"></div>';
  pane.append(d);return d.firstElementChild;
}
function addRow(cls,html){
  const e=pane.querySelector('.empty');if(e)e.remove();
  const d=document.createElement('div');d.className=cls;d.innerHTML=html;
  pane.append(d);return d;
}
function waiting(text){
  const d=document.createElement('div');d.className='thinking';
  d.innerHTML='<div class="dots"><i></i><i></i><i></i></div><span></span>';
  d.querySelector('span').textContent=text;return d;
}
async function post(url,body){
  const r=await fetch(url,{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  return r.json();
}

/* ── боковое ───────────────────────────────────────────────────── */
async function loadProject(){
  try{
    const d=await (await fetch('/project',{cache:'no-store'})).json();
    const box=$('#live');box.replaceChildren();
    for(const[key,title]of[['branch','ветка'],['work','не закоммичено'],
                           ['commits','последние коммиты']]){
      const card=document.createElement('div');card.className='live';
      card.innerHTML='<div class="ttl"></div><pre></pre>';
      card.querySelector('.ttl').textContent=title;
      card.querySelector('pre').textContent=(d[key]||'').slice(0,420);
      box.append(card);
    }
  }catch(e){}
}
function renderQuestions(){
  const box=$('#qlist');box.replaceChildren();
  for(const q of state.questions||[]){
    const d=document.createElement('div');
    d.innerHTML='<span class="k"></span><span class="t"></span>';
    const k=d.querySelector('.k');
    k.className='k '+q.kind;k.textContent=q.kind;
    d.querySelector('.t').textContent=q.q;
    d.title=q.q+'\n\nждём инструменты: '+(q.tools.join(', ')||'никаких');
    d.onclick=()=>{msgEl.value=q.q;grow();sync();send();};
    box.append(d);
  }
}
function renderTools(){
  const box=$('#toollist');box.replaceChildren();
  for(const t of state.tools||[]){
    const d=document.createElement('div');
    d.className=t.server;d.textContent=t.name;box.append(d);
  }
}
function apply(d){
  if(!d)return;
  state={...state,...d};
  const ix=state.index||{};
  $('#ix').textContent=num(ix.chunks)+' кусков';
  $('#mcp').textContent=state.mcp||'—';
  $('#subtitle').textContent='документы + git через MCP';
  renderQuestions();renderTools();
}

/* ── ответ ─────────────────────────────────────────────────────── */
function renderAnswer(r){
  addMsg('bot').textContent=(r.text||'(пусто)').trim();

  const chips=[];
  for(const t of r.tools||[])
    chips.push(`<span class="chip git">git ${esc(t.name.split('__')[1])}`
      +`${t.failed?' ✗':''}</span>`);
  for(const d of (r.docs||[]).slice(0,3))
    chips.push(`<span class="chip doc">${esc(d.chunk_id)}</span>`);
  if(!chips.length)chips.push('<span class="chip none">источников нет</span>');
  addRow('from',chips.join(''));

  if(r.source_ok!==undefined){
    const ok=r.source_ok&&r.said_ok;
    addRow('verdict '+(ok?'ok':'no'),
      (ok?'✓ ':'✗ ')+`вид «${esc(r.kind)}»: источник `
      +(r.source_ok?'верный':'НЕ ТОТ')+', ответ '
      +(r.said_ok?'содержит ожидаемое':'без ожидаемого'));
  }
  addRow('meta',`${num(r.tokens)} токенов · ${r.seconds}с · кругов ${r.rounds}`);
  scroll();
}

async function send(){
  const question=msgEl.value.trim();
  if(!question||busy)return;
  busy=true;msgEl.value='';grow();sync();lock();
  addMsg('me').textContent=question;
  const wait=waiting('выбираю источник…');pane.append(wait);scroll();
  try{
    const res=await fetch('/help',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question,local:$('#local').checked})});
    const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){
      const{value,done}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let nl;
      while((nl=buf.indexOf('\n'))!==-1){
        const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);
        if(!line)continue;
        const m=JSON.parse(line);
        if(m.error){wait.remove();addMsg('bot','err').textContent=m.error;break;}
        if(m.answer){wait.remove();renderAnswer(m.answer);loadProject();}
      }
    }
  }catch(e){wait.remove();addMsg('bot','err').textContent=String(e.message||e);}
  finally{wait.remove();busy=false;sync();lock();scroll();msgEl.focus();}
}

async function runCheck(){
  if(busy)return;
  busy=true;lock();
  pane.replaceChildren();
  const table=document.createElement('table');table.className='t';
  table.innerHTML='<thead><tr><th>#</th><th>вид</th><th>вопрос</th>'
    +'<th class="mid">источник</th><th class="mid">ответ</th>'
    +'<th>что звал</th><th class="num">ток.</th></tr></thead><tbody></tbody>';
  pane.append(table);
  const body=table.querySelector('tbody');
  const wait=waiting('девять вопросов, около минуты…');pane.append(wait);
  const tick=ok=>`<span class="tick ${ok?'yes':'no'}">${ok?'✓':'✗'}</span>`;
  try{
    const res=await fetch('/check',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({local:$('#local').checked})});
    const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){
      const{value,done}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let nl;
      while((nl=buf.indexOf('\n'))!==-1){
        const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);
        if(!line)continue;
        const m=JSON.parse(line);
        if(m.error){wait.remove();
          pane.append(Object.assign(document.createElement('div'),
            {className:'err',textContent:m.error}));break;}
        if(m.check_start)
          wait.querySelector('span').textContent=
            `${m.check_start.total} вопросов, `
            +`${m.check_start.local?'локальная модель':'облако'}…`;
        if(m.row){
          const r=m.row;
          const tr=document.createElement('tr');
          tr.innerHTML='<td class="num"></td><td class="kk"></td>'
            +'<td class="qq"></td>'
            +`<td class="mid">${tick(r.source_ok)}</td>`
            +`<td class="mid">${tick(r.said_ok)}</td>`
            +'<td class="cc"></td>'
            +`<td class="num">${num(r.tokens)}</td>`;
          tr.children[0].textContent=r.n;
          tr.children[1].textContent=r.kind;
          tr.children[2].textContent=r.question.slice(0,44);
          tr.children[2].title=r.question;
          tr.children[5].textContent=
            (r.called||[]).map(c=>c.split('__')[1]).join(', ')||'—';
          body.append(tr);
          pane.scrollTop=pane.scrollHeight;
        }
        if(m.check_done){
          wait.remove();
          const t=m.check_done.tally;
          const total=Object.values(t).reduce((a,b)=>a+b[1],0);
          const ok=Object.values(t).reduce((a,b)=>a+b[0],0);
          const box=document.createElement('div');box.className='sum';
          box.innerHTML='<table><tbody>'
            +Object.entries(t).map(([k,v])=>
              `<tr><td>${k}</td><td>${v[0]}/${v[1]}</td></tr>`).join('')
            +`<tr><td>всего</td><td>${ok}/${total}</td></tr>`
            +`<tr><td>источник выбран неверно</td><td>${m.check_done.wrong}</td></tr>`
            +`<tr><td>модель</td><td>${m.check_done.local?'локальная':'облако'}</td></tr>`
            +'</tbody></table>';
          pane.append(box);
        }
      }
    }
  }catch(e){
    pane.append(Object.assign(document.createElement('div'),
      {className:'err',textContent:String(e.message||e)}));}
  finally{wait.remove();busy=false;lock();}
}

function sync(){sendEl.disabled=busy||!msgEl.value.trim();}
function lock(){for(const id of['check','clear','local'])$('#'+id).disabled=busy;}
function grow(){msgEl.style.height='auto';
  msgEl.style.height=msgEl.scrollHeight+'px';}
msgEl.addEventListener('input',()=>{grow();sync();});
msgEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
sendEl.addEventListener('click',send);
$('#check').addEventListener('click',runCheck);
$('#refresh').addEventListener('click',loadProject);
$('#clear').addEventListener('click',async()=>{
  await post('/clear',{local:$('#local').checked});showEmpty();});

fetch('/state').then(r=>r.json()).then(d=>{
  apply(d);
  $('#hint').textContent='оранжевое — git, сиреневое — документы';
  showEmpty();loadProject();
}).catch(()=>showEmpty());
setInterval(()=>{if(!busy)loadProject();}, 20000);
</script>
</body>
</html>
